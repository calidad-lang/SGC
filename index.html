<meta charset="utf-8">
<title>Control Documental SGC_64</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija arriba; columna de trabajo de hasta 1180px; el ciclo de 8 etapas encabeza el maestro y cada ficha */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EDEB; --ink:#17232A; --muted:#56656C; --line:#D5DCD9;
  --accent:#1E5E6A; --accent-soft:#DDEDEF; --accent-ink:#FFFFFF; --kraft:#9C6B33;
  --ok:#256B43; --ok-bg:#DFF0E5; --warn:#8A5A00; --warn-bg:#F8EBCF; --info:#1F548F; --info-bg:#E0EAF6;
  --bad:#A8352D; --bad-bg:#F8E1DE; --violet:#5E4691; --violet-bg:#ECE6F6; --gray-bg:#E6EAE8;
  --f-body:"Archivo","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEC; --muted:#9AAAAE; --line:#2A3A3F;
  --accent:#6CC0CC; --accent-soft:#1D3A40; --accent-ink:#0B1A1D; --kraft:#D3A066;
  --ok:#7FD3A0; --ok-bg:#183326; --warn:#F0C26A; --warn-bg:#3A2D12; --info:#8DB8F0; --info-bg:#192B44;
  --bad:#F2998F; --bad-bg:#3D1C19; --violet:#BBA6EE; --violet-bg:#2A2240; --gray-bg:#24333A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#162125; --sunk:#1C2A2F; --ink:#E4ECEC; --muted:#9AAAAE; --line:#2A3A3F;
  --accent:#6CC0CC; --accent-soft:#1D3A40; --accent-ink:#0B1A1D; --kraft:#D3A066;
  --ok:#7FD3A0; --ok-bg:#183326; --warn:#F0C26A; --warn-bg:#3A2D12; --info:#8DB8F0; --info-bg:#192B44;
  --bad:#F2998F; --bad-bg:#3D1C19; --violet:#BBA6EE; --violet-bg:#2A2240; --gray-bg:#24333A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:11px}
.brand b{display:block;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:6px;font-weight:500;display:flex;align-items:center;gap:6px}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--bad);color:var(--surface);border-radius:10px;font-size:11px;font-weight:600;padding:1px 7px;font-variant-numeric:tabular-nums}
.who{font-size:12px;color:var(--muted);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.who select{width:auto;padding:4px 8px;font-size:13px}
.authv{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.authv .acard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px}
.authv h1{font-size:22px;margin:4px 0 0}.authv .sub{color:var(--muted)}.authv p{margin:0}
.authv .abrand{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.authv .abrand b{display:block;font-size:14px}.authv .abrand .sub{display:block;font-size:12px}
.authv .amsg{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:14px}.authv .amsg.ok{background:var(--ok-bg);color:var(--ok)}
.authv .alinks{display:flex;flex-direction:column;gap:6px;font-size:13px;padding-top:4px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
.whoact{display:flex;gap:10px;margin-top:4px}.whoact .lnk{font-size:12px;color:inherit;opacity:.85}
.localbar{background:var(--warn-bg);color:var(--warn);font-size:13px}
.localbar .wrap{padding-block:6px}
main{padding-block:24px 64px}
h1{font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:16px;margin:0;font-weight:600;letter-spacing:-.005em}
h3{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lede{color:var(--muted);margin:4px 0 0;max-width:72ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:20px}
@media (max-width:900px){.pipe{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ps{position:relative;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:0 0 var(--r) var(--r);padding:10px 10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.ps:hover{border-color:var(--accent);border-top-color:var(--accent)}
.ps.has{border-top-color:var(--accent)}
.ps.on{background:var(--accent-soft);border-color:var(--accent)}
.ps .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ps .t{font-weight:600;font-size:14px}
.ps .s{font-size:12px;color:var(--muted);line-height:1.3}
.ps .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.ps.alert .n{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
label.f.chk input{width:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{font-size:13px;padding:5px 10px}
.btn[disabled],body.busy .btn{opacity:.55;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card > h2 + *{margin-top:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover{background:var(--sunk)}
.code{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap;color:var(--accent);text-decoration:none}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--gray-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.solicitud,.chip.pendiente{background:var(--warn-bg);color:var(--warn)}
.chip.elaboracion{background:var(--gray-bg);color:var(--ink)}
.chip.revision{background:var(--warn-bg);color:var(--warn)}
.chip.aprobacion,.chip.publicacion{background:var(--info-bg);color:var(--info)}
.chip.divulgacion{background:var(--accent-soft);color:var(--accent)}
.chip.seguimiento,.chip.aceptada,.chip.vigente{background:var(--ok-bg);color:var(--ok)}
.chip.obsoleto{background:var(--gray-bg);color:var(--muted);text-decoration:line-through}
.chip.externo{background:var(--violet-bg);color:var(--violet)}
.chip.vencida,.chip.rechazada{background:var(--bad-bg);color:var(--bad)}
.chip.ejemplo{background:transparent;border:1px dashed var(--kraft);color:var(--kraft)}
.chip.ejemplo::before{display:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.callout{border-radius:6px;padding:10px 12px;font-size:14px;background:var(--sunk)}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.info{background:var(--info-bg);color:var(--info)}
.docgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.docgrid{grid-template-columns:minmax(0,1fr)}}
dl.meta{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cycle{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
@media (max-width:900px){.cycle{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px}}
.cy{padding-top:8px;border-top:4px solid var(--line);min-width:0}
.cy b{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.cy span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.cy.done{border-color:var(--ok)}.cy.done b{color:var(--ok)}
.cy.now{border-color:var(--accent)}.cy.now b{color:var(--accent)}
.cy.end.now{border-color:var(--muted)}
.cyclenote{margin-top:14px;font-size:14px}
.fileline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:6px;padding:10px 12px}
.fileline .nm{font-family:var(--f-mono);font-size:13px;flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.log li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.picker{position:relative}
.picker .cur{display:flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 10px;background:var(--surface)}
.picker .cur .nm{flex:1;min-width:0;color:var(--ink);font-weight:500}
.picker .cur .nm.none{color:var(--muted);font-weight:400}
.picker .menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;max-height:260px;overflow:auto}
.picker .menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:4px;padding:7px 8px;cursor:pointer}
.picker .menu button:hover{background:var(--sunk)}
.picker .menu img{width:22px;height:22px;border-radius:50%}
.picker .menu .none{padding:8px;color:var(--muted);font-size:13px}
.people{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.pchip button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;padding:0 6px}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.req .act{grid-column:1/-1}
.inbox h2{display:flex;gap:8px;align-items:center}
.inbox ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.inbox li{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inbox li:first-child{border-top:0}
.inbox li a{color:inherit;text-decoration:none;flex:1;min-width:0}
.inbox li a:hover b{text-decoration:underline}
.countpill{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);padding:1px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.cfgrow{display:grid;grid-template-columns:90px minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:700px){.cfgrow{grid-template-columns:80px minmax(0,1fr)}.cfgrow .picker,.cfgrow .btn{grid-column:1/-1}}
.cfgrow.t{grid-template-columns:90px minmax(0,1fr) auto}
.cfgrow.p{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:700px){.cfgrow.p{grid-template-columns:minmax(0,1fr)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.miss{color:var(--warn);font-weight:500}
.fileline .ext{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
table.pivot td,table.pivot th{text-align:right}
table.pivot td:first-child,table.pivot th:first-child{text-align:left}
table.pivot td.zero{color:var(--line)}
table.pivot td.warnc .cell{color:var(--warn)}
table.pivot tr.tot td{font-weight:600;background:var(--sunk)}
.cell{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:2px 6px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell:hover{background:var(--accent-soft)}
.incbar:hover{filter:brightness(.98)}
.cy.skip{border-top-style:dashed;opacity:.55}
.actrow{display:grid;grid-template-columns:20px minmax(0,2fr) minmax(0,1.2fr) 150px auto;gap:8px;align-items:center}
@media (max-width:760px){.actrow{grid-template-columns:20px minmax(0,1fr)}.actrow>*:nth-child(n+3){grid-column:2}}
.actcard{border:1px solid var(--line);border-radius:6px;padding:12px}
.actcard.ok{background:var(--ok-bg);border-color:transparent}
.m6grid{display:flex;flex-direction:column;gap:10px}
.m6{background:var(--sunk);border-radius:6px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.m6>.row b{font-size:15px}
.m6 ul{margin:0;padding-left:18px;font-size:14px}
.m6row{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px;align-items:start}
.m6row textarea{min-height:44px;font-size:14px;field-sizing:content;resize:vertical}
.m6row select{padding:8px 6px}
.m6>.btn{align-self:flex-start}
.whys{margin:0;padding-left:20px;font-size:14px}
.nc-active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis>div{background:var(--sunk);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.kpis .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis .l{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 28px;gap:8px;align-items:center;font-size:13px}
.bar .bt{background:var(--sunk);border-radius:3px;height:10px;overflow:hidden}
.bar .bt span{display:block;height:100%;background:var(--accent)}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums}
nav.tabs.mods .navsep{width:1px;background:var(--line);margin:4px 6px}
.subnav{background:var(--sunk);border-top:1px solid var(--line)}
.subnav .wrap{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-block:6px}
.subnav .modname{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.subnav nav.tabs a{padding:5px 10px;font-size:14px}
.subnav nav.tabs a.on{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:800px){.modgrid{grid-template-columns:minmax(0,1fr)}}
.modcard{display:flex;flex-direction:column;gap:16px}
.modhead{display:flex;gap:12px;align-items:center}
.modicon{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;flex:none}
.modicon.nc{background:var(--warn-bg);color:var(--warn)}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hstat{background:var(--sunk);border-radius:6px;padding:10px;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.hstat:hover{outline:1px solid var(--accent)}
.hstat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hstat .l{font-size:12px;color:var(--muted)}
.hstat.warn .n{color:var(--bad)}
.soon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:700px){.soon{grid-template-columns:minmax(0,1fr)}}
.soonitem{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-size:14px}
.soonitem span{font-size:12px}
.localbar .wrap{display:flex;gap:6px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.localbar .actor{display:flex;align-items:center;gap:6px;font-weight:600}

function viewReport(){
  const c=cfg(),all=[...S.docs.values()],act=all.filter(d=>!d.obsolete);
  const types=c.types.filter(t=>act.some(d=>d.type===t.code)||["E","P","F"].includes(t.code));
  let h=`<div class="pagehead"><div><h1>Informe del listado maestro</h1><p class="lede">Documentos activos por proceso y tipo, etapa del ciclo y datos pendientes por completar. Reemplaza la hoja «Informe» del F_GDM_01 y se actualiza sola.</p></div><button class="btn pri" data-act="xlsx">Exportar F_GDM_01 (Excel)</button></div><div class="stack">`;
  h+=`<section class="card"><h2>Documentos activos por proceso y tipo</h2><div class="tablewrap" style="margin-top:12px"><table class="pivot"><thead><tr><th>Proceso</th>${types.map(t=>`<th title="${esc(t.name)}">${esc(t.code)}</th>`).join("")}<th>Total</th></tr></thead><tbody>`+
    c.processes.map(p=>{const ds=act.filter(d=>d.process===p.code);return `<tr><td><span class="mono">${esc(p.code)}</span> <span class="sub">${esc(p.name)}</span></td>${types.map(t=>{const n=ds.filter(d=>d.type===t.code).length;return `<td class="num ${n?"":"zero"}">${n?`<button class="cell" data-act="goto" data-proc="${esc(p.code)}" data-type="${esc(t.code)}">${n}</button>`:"0"}</td>`}).join("")}<td class="num"><b>${ds.length}</b></td></tr>`}).join("")+
    `<tr class="tot"><td>Total</td>${types.map(t=>`<td class="num">${act.filter(d=>d.type===t.code).length}</td>`).join("")}<td class="num">${act.length}</td></tr></tbody></table></div><p class="hint">${types.map(t=>t.code+" = "+t.name).join(" · ")}</p></section>`;
  const stg=SK.slice(1);
  h+=`<section class="card"><h2>Etapa del ciclo por proceso</h2><div class="tablewrap" style="margin-top:12px"><table class="pivot"><thead><tr><th>Proceso</th>${stg.map(s=>`<th>${esc(LBL[s])}</th>`).join("")}</tr></thead><tbody>`+
    c.processes.map(p=>{const ds=all.filter(d=>d.process===p.code);return `<tr><td class="mono">${esc(p.code)}</td>${stg.map(s=>{const n=ds.filter(d=>phase(d)===s).length;return `<td class="num ${n?"":"zero"}">${n}</td>`}).join("")}</tr>`}).join("")+`</tbody></table></div></section>`;
  const cats=["versión","fecha de vigencia","archivo","nivel de acceso","retención y disposición","responsable"];
  h+=`<section class="card"><h2>Datos por completar</h2><p class="sub" style="margin:6px 0 12px">Documentos activos a los que les falta información exigida por el control de la información documentada (ISO 9001 §7.5.3). Pulsa una cifra para ver la lista.</p><div class="tablewrap"><table class="pivot"><thead><tr><th>Proceso</th>${cats.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>`+
    c.processes.map(p=>{const ds=act.filter(d=>d.process===p.code);return `<tr><td class="mono">${esc(p.code)}</td>${cats.map(k=>{const n=ds.filter(d=>missing(d).includes(k)).length;return `<td class="num ${n?"warnc":"zero"}">${n?`<button class="cell" data-act="goto" data-proc="${esc(p.code)}" data-miss="${esc(k)}">${n}</button>`:"0"}</td>`}).join("")}</tr>`}).join("")+
    `<tr class="tot"><td>Total</td>${cats.map(k=>`<td class="num">${act.filter(d=>missing(d).includes(k)).length}</td>`).join("")}</tr></tbody></table></div></section>`;
  const rec=all.filter(d=>d.oldCode&&d.oldCode!==d.code).sort(sortCode);
  if(rec.length)h+=`<section class="card"><h2>Recodificación aplicada <span class="countpill">${rec.length}</span></h2><p class="sub" style="margin:6px 0 12px">Actualiza el código en el encabezado de cada archivo. La exportación a Excel incluye esta tabla en una hoja aparte.</p><div class="tablewrap" style="max-height:360px;overflow:auto"><table><thead><tr><th>Código anterior</th><th>Código nuevo</th><th>Documento</th></tr></thead><tbody>${rec.map(d=>`<tr><td class="mono">${esc(d.oldCode)}</td><td><a class="code" href="#doc-${esc(d.id)}">${esc(d.code)}</a></td><td>${esc(d.title)}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h+`</div>`;
}

/* ---------- Ficha ---------- */
function viewDoc(id){
  const d=S.docs.get(id);
  if(!d)return `<a class="back" href="#maestro">← Volver al maestro</a><div class="card" style="margin-top:16px"><div class="empty"><b>Documento no encontrado</b>Puede haber sido eliminado o el enlace es incorrecto.</div></div>`;
  const cp=cyclePhase(d),mi=missing(d);
  let note="";
  if(d.obsolete)note=`<div class="callout bad cyclenote">Obsoleto${d.obsoletedAt?" desde "+fmtD(d.obsoletedAt):""}. ${esc(d.obsoleteReason||"")} Se conserva solo como evidencia; no debe usarse en la operación.</div>`;
  else if(d.draft&&d.current)note=`<div class="callout info cyclenote">La v${d.current.version} sigue vigente en seguimiento mientras la v${d.draft.version} avanza por ${LBL[d.draft.stage].toLowerCase()}.</div>`;
  else if(d.draft&&d.draft.stage==="publicacion"&&d.imported)note=`<div class="callout info cyclenote">Venía del listado anterior como vigente con fecha futura (${fmtD(d.draft.plannedDate)}). Queda por lanzamiento: carga el archivo y publícalo cuando llegue la fecha.</div>`;
  else if(d.external)note=`<div class="callout cyclenote">Documento externo: no pasa por elaboración interna. Se controla su vigencia en seguimiento.</div>`;
  let h=`<a class="back" href="#maestro">← Volver al maestro</a>
  <div class="pagehead" style="margin-top:12px"><div><div class="row" style="gap:10px"><span class="code" style="font-size:15px">${esc(d.code)}</span>${d.oldCode&&d.oldCode!==d.code?`<span class="sub mono">antes ${esc(d.oldCode)}</span>`:""}${chipsFor(d)}</div>
  <h1 style="margin-top:6px">${esc(d.title)}</h1><p class="lede">${esc(typeName(d.type))} · ${esc(procName(d.process))}${d.description?" · "+esc(d.description):""}</p></div>
  <div class="row">${d.current&&!d.obsolete&&!d.draft&&S.canWrite?`<button class="btn" data-act="req-change" data-id="${esc(d.id)}">Solicitar cambio</button>`:""}</div></div>
  <section class="card" style="margin-bottom:16px"><h2 style="margin-bottom:12px">Ciclo de vida</h2>${cycleBar(cp)}${note}</section>`;
  if(mi.length)h+=`<div class="callout warn" style="margin-bottom:16px">Datos por completar: <b>${esc(mi.join(", "))}</b>.${canOwn(d)&&!d.obsolete?` <button class="btn sm" data-act="edit-meta" data-id="${esc(d.id)}" style="margin-left:6px">Completar ficha</button>`:""}</div>`;
  h+=`<div class="docgrid"><div class="stack">`;
  if(d.draft&&!d.obsolete)h+=panelDraft(d);
  if(d.current)h+=d.external?panelExternal(d):panelCurrent(d);
  h+=panelVersions(d)+`</div><div class="stack">`+panelMeta(d)+ncDocPanel(d)+panelLog(d)+`</div></div>`;
  return h;
}
function fileLine(o,fn){
  if(!o||!o.assetId)return `<div class="fileline"><span class="nm" style="color:var(--muted)">Sin archivo adjunto</span></div>`;
  const ext=extOf(o.fileName),t=FILES[ext]||{},a=`data-asset="${esc(o.assetId)}" data-kind="${esc(o.fileKind||"")}" data-name="${esc(o.fileName||"")}"`;
  let view="";
  if(t.view)view=`<button class="btn sm" data-act="view-file" ${a}>Ver</button>`;
  return `<div class="fileline"><span class="ext">${esc((ext||"").toUpperCase())}</span><span class="nm">${esc(o.fileName||"archivo")}</span>${view}${S.local||S.dl?`<button class="btn sm" data-act="download" ${a} data-fn="${esc(fn+"."+(ext||"bin"))}">Descargar</button>`:""}</div>`}
function uploadField(kind,id,label){
  if(!S.assets&&!S.local)return `<p class="hint">Tu nivel de acceso no permite adjuntar archivos. Pide al administrador documental que lo cargue.</p>`;
  return `<label class="f">${label}<input type="file" accept="${ACCEPT}" data-upload="${kind}" data-id="${esc(id)}" id="up-${kind}-${esc(id)}"><span class="hint">Excel (.xlsx), Word (.docx), PowerPoint (.pptx), PDF o imagen.</span></label>`}
function waitMsg(who,what){return `<p class="hint">Esperando a ${esc(nm(who))} para ${what}.</p>`}
function noteArea(id,label){return `<label class="f">${label}<textarea id="dr-note-${esc(id)}"></textarea></label>`}
function panelDraft(d){
  const dr=d.draft,st=dr.stage,id=d.id,code=d.code;
  let h=`<section class="card stack"><div class="row" style="justify-content:space-between"><h2>${LBL[st]} · <span class="mono">v${dr.version}</span></h2>${chip(st)}</div>`;
  if(dr.notes)h+=`<div class="callout warn"><b>Observaciones de ${esc(nm(dr.notesBy,"revisión"))}:</b> ${esc(dr.notes)}</div>`;
  if(dr.approverId&&dr.authorId&&dr.approverId===dr.authorId)h+=`<div class="callout info">El autor y el aprobador son la misma persona. Se recomienda que apruebe alguien distinto a quien elaboró.</div>`;
  if(st==="elaboracion"){
    if(canDraft(d)){
      h+=`<div class="grid3"><label class="f">Autor${S.isAdmin?pickerHtml("dr."+id+".author",dr.authorId):`<div style="padding:9px 0;color:var(--ink)">${esc(nm(dr.authorId))}</div>`}</label>
      <label class="f">Revisor${pickerHtml("dr."+id+".reviewer",dr.reviewerId)}</label>
      <label class="f">Aprobador${pickerHtml("dr."+id+".approver",dr.approverId)}</label></div>
      <label class="f">Descripción del cambio<textarea id="dr-chg-${esc(id)}" placeholder="Qué cambia respecto a la versión anterior y por qué">${esc(dr.changeDescription)}</textarea></label>
      <div class="stack" style="gap:8px"><h3>Archivo del documento</h3>${fileLine(dr,code+"_v"+dr.version+"_borrador")}${uploadField("draft",id,dr.assetId?"Reemplazar el archivo":"Cargar el archivo")}</div>
      <div class="row"><button class="btn" data-act="save-draft" data-id="${esc(id)}">Guardar</button><button class="btn pri" data-act="to-review" data-id="${esc(id)}">Enviar a revisión</button>
      ${S.confirm==="discard:"+id?`<span class="row"><button class="btn sm danger" data-act="discard-yes" data-id="${esc(id)}">${d.current?"Sí, descartar esta versión":"Sí, eliminar el documento"}</button><button class="btn sm" data-act="cancel-confirm">Cancelar</button></span>`:`<button class="btn ghost" data-act="discard" data-id="${esc(id)}">${d.current?"Descartar versión":"Eliminar documento"}</button>`}</div>`;
    }else h+=`<dl class="meta"><dt>Autor</dt><dd>${esc(nm(dr.authorId))}</dd><dt>Revisor</dt><dd>${esc(nm(dr.reviewerId))}</dd><dt>Aprobador</dt><dd>${esc(nm(dr.approverId))}</dd></dl>`+waitMsg(dr.authorId,"terminar la elaboración");
    return h+`</section>`;
  }
  h+=`<dl class="meta"><dt>Fecha de solicitud</dt><dd>${fmtD(isoDay(dr.startedAt)||d.requestDate)}</dd><dt>Fecha de aprobación</dt><dd>${dr.approvedAt?fmtD(dr.approvedAt):"Pendiente"}</dd><dt>Fecha de vigencia</dt><dd>${dr.plannedDate?fmtD(dr.plannedDate)+' <span class="sub">(prevista)</span>':"Se define al publicar"}</dd>${st==="revision"||st==="aprobacion"?`<dt>Revisor</dt><dd>${esc(nm(dr.reviewerId))}</dd><dt>Aprobador</dt><dd>${esc(nm(dr.approverId))}</dd>`:peopleRows(dr.authorId,dr.reviewedBy,dr.approvedBy)}${changeRow(dr.changeDescription)}</dl>
    <div class="stack" style="gap:8px"><h3>Archivo</h3>${fileLine(dr,code+"_v"+dr.version)}</div>`;
  if(st==="revision"){
    if(canReview(d))h+=noteArea(id,"Observaciones de revisión (obligatorias si devuelves)")+`<div class="row"><button class="btn pri" data-act="review-ok" data-id="${esc(id)}">Revisión conforme</button><button class="btn danger" data-act="return" data-id="${esc(id)}">Devolver a elaboración</button></div>`;
    else h+=waitMsg(dr.reviewerId,"revisar");
  }else if(st==="aprobacion"){
    if(canApprove(d))h+=noteArea(id,"Comentarios de aprobación (obligatorios si devuelves)")+`<div class="row"><button class="btn pri" data-act="approve" data-id="${esc(id)}">Aprobar v${dr.version}</button><button class="btn danger" data-act="return" data-id="${esc(id)}">Devolver a elaboración</button></div><p class="hint">Al aprobar, el documento pasa a publicación, donde el administrador documental fija la fecha de vigencia y la divulgación.</p>`;
    else h+=waitMsg(dr.approverId,"aprobar");
  }else if(st==="publicacion"){
    if(canPublish()){
      const mode=S.pbMode[id]||"all",ppl=S.dv[id]||[];
      h+=`<hr class="sep"><div class="grid2"><label class="f">Fecha de entrada en vigencia<input type="date" id="pb-date-${esc(id)}" value="${esc(dr.plannedDate||todayISO())}"></label>
      <label class="f">Divulgación<select id="pb-mode-${esc(id)}"><option value="all" ${mode==="all"?"selected":""}>Todo el personal confirma lectura</option><option value="people" ${mode==="people"?"selected":""}>Personas específicas confirman lectura</option><option value="none" ${mode==="none"?"selected":""}>No requiere divulgación</option></select></label></div>
      ${mode==="people"?`<div class="stack" style="gap:8px"><h3>Personas que deben confirmar lectura</h3><div class="people">${ppl.map(p=>`<span class="pchip">${esc(nm(p))}<button type="button" data-act="dv-remove" data-id="${esc(id)}" data-p="${esc(p)}" aria-label="Quitar">×</button></span>`).join("")||`<span class="sub">Nadie agregado todavía.</span>`}</div>${pickerHtml("dv."+id+".add",null,"Agregar persona")}</div>`:""}
      ${uploadField("draft",id,dr.assetId?"Reemplazar por el archivo controlado final (opcional)":"Cargar el archivo controlado (obligatorio para publicar)")}
      <div class="row"><button class="btn pri" data-act="publish" data-id="${esc(id)}">Publicar v${dr.version}</button><button class="btn danger" data-act="return-pub" data-id="${esc(id)}">Devolver a elaboración</button></div>
      <p class="hint">Al publicar${d.current?`, la v${d.current.version} pasa a obsoleta y`:""} la nueva versión queda vigente${mode==="none"?" y pasa directo a seguimiento":" y entra en divulgación"}.</p>`;
    }else h+=`<p class="hint">Aprobado. Esperando a que el administrador documental lo publique${dr.plannedDate?" (fecha prevista "+fmtD(dr.plannedDate)+")":""}.</p>`;
  }
  return h+`</section>`;
}
function panelCurrent(d){
  const c=d.current,id=d.id,dv=c.divulgation||{mode:"none"};
  let h=`<section class="card stack"><div class="row" style="justify-content:space-between"><h2>${d.obsolete?"Última versión":"Versión vigente"} · <span class="mono">${d.versionMissing?"versión sin dato":"v"+c.version}</span></h2><span class="sub">Vigente desde ${fmtD(c.effectiveDate)}</span></div>
  ${fileLine(c,d.code+"_v"+c.version)}
  ${!c.assetId&&!d.obsolete&&canOwn(d)?uploadField("current",id,"Cargar el archivo de la versión vigente"):""}
  <dl class="meta"><dt>Fecha de solicitud</dt><dd>${fmtD(c.requestDate||d.requestDate)}</dd><dt>Fecha de aprobación</dt><dd>${fmtD(c.approvedAt)}</dd><dt>Fecha de vigencia</dt><dd>${fmtD(c.effectiveDate)}</dd>${peopleRows(c.authorId,c.reviewerId,c.approverId)}${changeRow(c.changeDescription)}</dl>`;
  if(d.obsolete)return h+`</section>`;
  const ack=ackersOf(d);
  if(dv.mode!=="none"){
    h+=`<hr class="sep"><div class="stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h3>Divulgación</h3>${dvOpen(d)?chip("divulgacion","Abierta"):chip("seguimiento","Cerrada el "+fmtD(dv.closedAt))}</div>
    <p class="sub" style="margin:0">Audiencia: ${dv.mode==="all"?"todo el personal":esc((dv.people||[]).map(p=>nm(p)).join(", ")||"—")}. ${ack.length} ${ack.length===1?"confirmación":"confirmaciones"} de lectura${ack.length?": "+ack.map(u=>esc(nm(u))).join(", "):""}.</p>`;
    if(dv.mode==="people"){const miss=(dv.people||[]).filter(p=>!ack.includes(p));if(miss.length)h+=`<p class="sub" style="margin:0">Faltan por confirmar: ${miss.map(p=>esc(nm(p))).join(", ")}.</p>`}
    h+=`<div class="row">`;
    if(S.me&&S.canWrite&&(inAudience(d)||S.local))h+=acked(id,c.version)?chip("seguimiento",(S.local?nm(S.me)+" leyó":"Leíste")+" esta versión"):`<button class="btn pri" data-act="ack" data-id="${esc(id)}">${S.local?"Registrar lectura de "+esc(nm(S.me)):"Confirmo que leí la v"+c.version}</button>`;
    if(dvOpen(d)&&canOwn(d))h+=`<button class="btn" data-act="close-dv" data-id="${esc(id)}">Cerrar divulgación y pasar a seguimiento</button>`;
    h+=`</div></div>`;
  }
  if(!dvOpen(d)){
    const last=(d.reviews||[]).slice(-3).reverse();
    h+=`<hr class="sep"><div class="stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h3>Seguimiento</h3>${overdue(d)?chip("vencida"):`<span class="sub">Próxima revisión ${fmtD(d.nextReview)}</span>`}</div>
    ${last.length?`<ul class="log">${last.map(r=>`<li><time>${fmtD(r.at)}</time><div><b>${esc(r.outcomeLabel)}</b> · ${esc(nm(r.by))}${r.note?`<div class="sub">${esc(r.note)}</div>`:""}</div></li>`).join("")}</ul>`:`<p class="sub" style="margin:0">Sin revisiones periódicas registradas todavía.</p>`}`;
    if(canOwn(d)&&!d.draft)h+=`<div class="grid2"><label class="f">Resultado de la revisión periódica<select id="sg-out-${esc(id)}"><option value="ok">Sigue vigente sin cambios</option><option value="change">Requiere actualización (nueva versión)</option><option value="obsolete">Ya no se necesita (anular)</option></select></label>
      <label class="f">Observaciones<input id="sg-note-${esc(id)}" placeholder="Obligatorias si se actualiza o se anula"></label></div>
      <div class="row"><button class="btn pri" data-act="periodic" data-id="${esc(id)}">Registrar revisión</button>${S.isAdmin?`<button class="btn ghost" data-act="obsolete" data-id="${esc(id)}">Anular documento</button>`:""}</div>`;
    h+=`</div>`;
    if(S.confirm==="obsolete:"+id)h+=obsoleteForm(d);
  }
  return h+`</section>`;
}
function obsoleteForm(d){return `<div class="callout bad stack" style="gap:10px"><label class="f" style="color:inherit">Motivo de la anulación<textarea id="obs-${esc(d.id)}" placeholder="Ej.: proceso eliminado, reemplazado por otro código"></textarea></label><div class="row"><button class="btn danger" data-act="obsolete-yes" data-id="${esc(d.id)}">Pasar a obsoleto</button><button class="btn" data-act="cancel-confirm">Cancelar</button></div></div>`}
function panelExternal(d){
  const c=d.current,id=d.id,can=canOwn(d);
  let h=`<section class="card stack"><div class="row" style="justify-content:space-between"><h2>Documento externo</h2><span class="sub">Próxima verificación ${fmtD(d.nextReview)}</span></div>
  <dl class="meta"><dt>Emisor</dt><dd>${esc(d.source||"—")}</dd><dt>Edición vigente</dt><dd class="mono">${esc(c.edition||"—")}</dd><dt>Fecha de edición</dt><dd>${fmtD(c.effectiveDate)}</dd><dt>Última verificación</dt><dd>${fmtD(d.lastVerified||c.approvedAt)} · ${esc(nm(d.lastVerifiedBy||c.approverId,"—"))}</dd></dl>
  ${fileLine(c,d.code+"_edicion")}`;
  if(!d.obsolete&&can){
    h+=`<hr class="sep"><h3>Seguimiento: verificar vigencia</h3><div class="grid2"><label class="f">Edición vigente<input id="ex-ed-${esc(id)}" value="${esc(c.edition||"")}"></label><label class="f">Fecha de edición<input type="date" id="ex-dt-${esc(id)}" value="${esc(isoDay(c.effectiveDate))}"></label></div>
    ${uploadField("current",id,"Reemplazar archivo (opcional)")}
    <div class="row"><button class="btn pri" data-act="verify" data-id="${esc(id)}">Confirmar verificación</button>${S.isAdmin?`<button class="btn ghost" data-act="obsolete" data-id="${esc(id)}">Anular documento</button>`:""}</div><p class="hint">Si la edición cambió, la anterior pasa al historial.</p>`;
    if(S.confirm==="obsolete:"+id)h+=obsoleteForm(d);
  }
  return h+`</section>`;
}
function panelVersions(d){
  if(!d.versions||!d.versions.length)return"";
  return `<section class="card"><h2>Versiones obsoletas</h2><div class="tablewrap" style="margin-top:12px;border:0"><table><thead><tr><th>Versión</th><th>Vigencia</th><th>Aprobó</th><th>Cambio</th><th></th></tr></thead><tbody>`+
  d.versions.slice().reverse().map(v=>`<tr><td class="mono">${esc(d.external?v.edition:"v"+v.version)}</td><td class="num">${fmtD(v.effectiveDate)} – ${fmtD(v.obsoletedAt)}</td><td>${esc(nm(v.approverId,"—"))}</td><td class="sub">${esc(v.changeDescription||"—")}</td><td>${v.assetId&&(S.local||S.dl)?`<button class="btn sm" data-act="download" data-asset="${esc(v.assetId)}" data-kind="${esc(v.fileKind||"")}" data-name="${esc(v.fileName||"")}" data-fn="${esc(d.code+"_v"+v.version+"_obsoleta."+(extOf(v.fileName)||"pdf"))}">Descargar</button>`:""}</td></tr>`).join("")+`</tbody></table></div><p class="hint">Se conservan solo como evidencia.</p></section>`;
}
const opt=(list,v)=>`<option value="">Sin definir</option>`+list.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("");
function panelMeta(d){
  const id=d.id,can=!d.obsolete&&canOwn(d);
  if(can&&S.confirm==="meta:"+id){
    return `<section class="card stack"><h2>Editar ficha</h2>
    ${S.isAdmin?`<label class="f">Código<input id="mt-code-${esc(id)}" class="mono" value="${esc(d.code)}"><span class="hint">Cambiarlo queda registrado en la bitácora con el código anterior.</span></label>`:""}
    <label class="f">Nombre del documento<input id="mt-title-${esc(id)}" value="${esc(d.title)}"></label>
    <label class="f">Descripción<textarea id="mt-desc-${esc(id)}">${esc(d.description||"")}</textarea></label>
    ${d.external?`<label class="f">Emisor o fuente<input id="mt-src-${esc(id)}" value="${esc(d.source||"")}"></label>`:""}
    ${S.isAdmin&&d.current&&!d.external?`<div class="grid2"><label class="f">Versión vigente<input type="number" min="1" id="mt-ver-${esc(id)}" value="${d.versionMissing?"":esc(d.current.version)}" placeholder="Sin dato"></label><label class="f">Fecha de vigencia<input type="date" id="mt-eff-${esc(id)}" value="${esc(isoDay(d.current.effectiveDate))}"></label></div>`:""}
    ${S.isAdmin&&d.draft&&d.draft.stage==="publicacion"&&d.versionMissing?`<label class="f">Versión<input type="number" min="1" id="mt-ver-${esc(id)}" placeholder="Sin dato"></label>`:""}

  const r=inbox();

  h+=sec("Elaboración · a tu cargo",r.elab,d=>li(d,d.draft.notes?"Devuelto con observaciones":"v"+d.draft.version+" en elaboración"),"No tienes documentos en elaboración.");
  h+=sec("Revisión · por revisar",r.revisar,d=>li(d,"v"+d.draft.version+" · elaboró "+esc(nm(d.draft.authorId))),"No tienes documentos por revisar.");
  h+=sec("Aprobación · por aprobar",r.aprobar,d=>li(d,"v"+d.draft.version+" · revisó "+esc(nm(d.draft.reviewedBy||d.draft.reviewerId))),"No tienes documentos por aprobar.");
  if(S.isAdmin)h+=sec("Publicación · por publicar",r.publicar,d=>li(d,"v"+d.draft.version+(d.draft.plannedDate?" · fecha prevista "+fmtD(d.draft.plannedDate):"")+(d.draft.assetId?"":" · falta el archivo")),"No hay documentos aprobados esperando publicación.");
  h+=sec("Divulgación · lecturas pendientes",r.leer,d=>li(d,"v"+d.current.version+" vigente desde "+fmtD(d.current.effectiveDate)),"Estás al día con la lectura de documentos.");
  if(r.divul.length)h+=sec("Divulgación · abiertas a tu cargo",r.divul,d=>li(d,ackersOf(d).length+" confirmaciones de lectura"),"");
  h+=sec("Seguimiento · revisiones periódicas próximas o vencidas",r.seguir,d=>li(d,(overdue(d)?"Vencida desde ":"Vence el ")+fmtD(d.nextReview)),"No hay revisiones periódicas en los próximos 30 días.");

function syncReqForm(){

  document.getElementById("rq-filew").hidden=kind==="anular";
  const now=document.getElementById("rq-now"),extEl=document.getElementById("rq-ext"),ext=isNew&&extEl&&extEl.checked;

function pickerHtml(key,id,ph){
  const v=Object.prototype.hasOwnProperty.call(S.pick,key)?S.pick[key]:id;
  return `<div class="picker" data-key="${esc(key)}"><div class="cur"><span class="nm ${v?"":"none"}">${v?esc(nm(v)):esc(ph||"Sin asignar")}</span><input type="search" class="pk-in" id="pk-${esc(key.replace(/[^\w-]/g,"_"))}" placeholder="Buscar…" aria-label="Buscar persona" style="border:0;padding:4px;width:90px;flex:0 1 90px"></div><div class="menu" hidden></div></div>`}
function pickVal(key,fb){return Object.prototype.hasOwnProperty.call(S.pick,key)?S.pick[key]:fb}
async function searchPeople(q){
  if(S.local){const ql=q.trim().toLowerCase();return [{id:"admin-local",name:"Administrador documental",role:""}].concat(cfg().people||[]).filter(p=>p.name&&(!ql||p.name.toLowerCase().includes(ql))).slice(0,12).map(p=>({id:p.id,name:p.name+(p.role?" · "+p.role:""),avatarUrl:""}))}
  if(!S.user)return null;try{return await S.user.search(q)}catch(e){return[]}
}
function wirePicker(el){
  const key=el.dataset.key,inp=el.querySelector(".pk-in"),menu=el.querySelector(".menu");let tok=0,hits=[];
  async function run(q){
    const my=++tok;const res=await searchPeople(q);if(my!==tok)return;
    if(res===null){menu.innerHTML=`<div class="none">La búsqueda de personas no está disponible en esta vista.</div>`;menu.hidden=false;return}
    hits=res;
    menu.innerHTML=(hits.length?hits.map((p,i)=>`<button type="button" data-i="${i}">${p.avatarUrl?`<img alt="" src="${esc(p.avatarUrl)}">`:""}<span></span></button>`).join(""):`<div class="none">${S.local?(cfg().people||[]).length?"Sin coincidencias.":"Agrega personas en Configuración.":q?"Sin coincidencias en tu organización.":"Escribe un nombre o correo."}</div>`)+(pickVal(key)&&!key.endsWith(".add")?`<button type="button" data-i="-1">Quitar asignación</button>`:"");
    menu.querySelectorAll("button[data-i]").forEach(b=>{const p=hits[Number(b.dataset.i)];if(p){b.querySelector("span").textContent=p.name;if(!S.local)S.names[p.id]=p.name}});
    menu.hidden=false;
  }

function fail(e){
  const c=e&&e.code;
  if(c==="msg")toast(e.message);
  else if(c==="invalid_argument"&&!S.local){S.readOnly=true;toast("No tienes permiso para guardar cambios en esta base documental.")}
  else if(c==="quota_exceeded")toast(S.local?"El almacenamiento del navegador está lleno. Descarga un respaldo y elimina documentos innecesarios.":"La base documental llegó a su capacidad máxima.");
  else if(c==="resource_exhausted"||c==="rate_limited")toast("Demasiadas operaciones seguidas. Espera unos segundos e intenta de nuevo.");
  else if(c==="too_large")toast("El archivo es demasiado grande.");
  else if(c==="quota_or_state")toast("Se agotó el espacio de archivos.");
  else if(c==="not_granted"||c==="capability_disabled")toast("Tu nivel de acceso no permite adjuntar archivos.");
  else{console.error(e);toast("No se pudo guardar. Intenta de nuevo.")}
}

function addBusinessDays(iso,n){const p=iso.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(iso,n){const p=String(iso).slice(0,10).split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

function ncDue(n){

/* ---- inbox ---- */
function ncInbox(){
  const r={clasificar:[],mias:[],acciones:[],evaluar:[],eficacia:[],cerrar:[]};
  S.ncs.forEach(n=>{if(n.closed)return;
    if(n.stage==="clasificacion"&&S.isAdmin)r.clasificar.push(n);
    if(["correccion","plan"].includes(n.stage)&&isDirector(n))r.mias.push(n);
    if(n.stage==="analisis"&&!(n.analysis&&n.analysis.submitted)&&isDirector(n))r.mias.push(n);
    if(n.stage==="analisis"&&n.analysis&&n.analysis.submitted&&S.isAdmin)r.evaluar.push(n);
    if(n.stage==="ejecucion")(n.actions||[]).forEach(a=>{if(a.status!=="cumplida"&&S.me&&a.responsibleId===S.me)r.acciones.push({n,a})});
    if(n.stage==="eficacia"&&S.isAdmin)r.eficacia.push(n);
    if(n.stage==="cierre"&&S.isAdmin)r.cerrar.push(n);
  });
  r.total=r.clasificar.length+r.mias.length+r.acciones.length+r.evaluar.length+r.eficacia.length+r.cerrar.length;
  return r;
}

function viewNcList(){
  const all=[...S.ncs.values()],f=S.ncf,q=f.q.trim().toLowerCase();
  const open=all.filter(n=>!n.closed);
  const cnt={};NCK.forEach(k=>cnt[k]=0);open.forEach(n=>cnt[n.stage]=(cnt[n.stage]||0)+1);cnt.cierre+=0;
  const closed=all.filter(n=>n.closed).length,venc=open.filter(ncOverdue).length;
  const rows=all.filter(n=>{
    if(q&&!((n.consec||"").toLowerCase().includes(q)||(n.description||"").toLowerCase().includes(q)))return false;
    if(f.proc&&n.process!==f.proc)return false;if(f.kind&&n.kind!==f.kind)return false;if(f.source&&n.source!==f.source)return false;
    if(f.st==="abiertas")return !n.closed;if(f.st==="cerradas")return n.closed;if(f.st==="vencidas")return !n.closed&&ncOverdue(n);if(f.st==="todas")return true;
    return !n.closed&&n.stage===f.st;
  }).sort((a,b)=>String(b.consec).localeCompare(String(a.consec),undefined,{numeric:true}));
  let h=`<div class="nctop"><div class="pagehead" style="flex-direction:column;align-items:flex-start;margin:0"><div><h1>Matriz de acciones correctivas y de mejora</h1><p class="lede">Equivale a la matriz F_GDM_07, con el flujo del procedimiento P_GDM_02 (formatos F_GDM_09 y F_GDM_12). Cada fila es una acción con su estado actual.</p></div>
  <div class="row">${S.canWrite?`<button class="btn pri" data-act="nc-new">Reportar no conformidad u oportunidad</button>`:""}</div></div>${ncChartCard(all)}</div>`;
  h+=`<div class="pipe">${NC_STAGES.slice(1).map(([k,l,s],i)=>`<button class="ps ${cnt[k]?"has":""} ${f.st===k?"on":""}" data-act="nc-stage" data-v="${k}"><span class="k">${i+2}</span><span class="t">${l}</span><span class="s">${s}</span><span class="n">${cnt[k]||0}</span></button>`).join("")}<button class="ps ${f.st==="cerradas"?"on":""}" data-act="nc-stage" data-v="cerradas"><span class="k">✓</span><span class="t">Cerradas</span><span class="s">Con eficacia verificada</span><span class="n">${closed}</span></button></div>`;
  if(venc)h+=`<button class="callout bad row incbar" data-act="nc-stage" data-v="vencidas" style="width:100%;justify-content:space-between;margin-bottom:12px;border:0;font:inherit;text-align:left;cursor:pointer"><span><b>${venc} con plazo vencido</b> (análisis, acciones o verificación de eficacia).</span><span>${f.st==="vencidas"?"Quitar filtro":"Ver lista"}</span></button>`;
  h+=`<div class="toolbar"><input class="grow" id="nf-q" type="search" placeholder="Buscar por consecutivo o descripción…" value="${esc(f.q)}" aria-label="Buscar">
    <select id="nf-proc" style="width:auto" aria-label="Proceso"><option value="">Todos los procesos</option>${cfg().processes.map(p=>`<option value="${esc(p.code)}" ${f.proc===p.code?"selected":""}>${esc(p.code+" · "+p.name)}</option>`).join("")}</select>
    <select id="nf-kind" style="width:auto" aria-label="Tipo"><option value="">Correctivas y de mejora</option><option value="AC" ${f.kind==="AC"?"selected":""}>Solo correctivas</option><option value="AM" ${f.kind==="AM"?"selected":""}>Solo de mejora</option></select>
    <select id="nf-source" style="width:auto" aria-label="Fuente"><option value="">Todas las fuentes</option>${SOURCES.map(s=>`<option ${f.source===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
    <select id="nf-st" style="width:auto" aria-label="Estado">${[["abiertas","Abiertas"],["vencidas","Vencidas"],["cerradas","Cerradas"],["todas","Todas"]].concat(NC_STAGES.slice(1).map(s=>[s[0],"Etapa: "+s[1]])).map(([k,l])=>`<option value="${k}" ${f.st===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
  if(!all.length)return h+`<div class="card"><div class="empty"><b>No hay no conformidades registradas</b>Usa «Reportar» cuando detectes un incumplimiento o una oportunidad de mejora.</div></div>`;
  if(!rows.length)return h+`<div class="card"><div class="empty"><b>Ninguna en esta selección</b>Cambia los filtros.</div></div>`;
  S.ncRows=rows;
  h+=`<div class="row" style="justify-content:space-between;margin:4px 0 10px"><div class="seg2" role="group" aria-label="Vista de la matriz"><button class="${S.ncView!=="full"?"on":""}" data-act="nc-view" data-v="short">Resumida</button><button class="${S.ncView==="full"?"on":""}" data-act="nc-view" data-v="full">Completa (F_GDM_07)</button></div><button class="btn" data-act="nc-xlsx">Exportar matriz (Excel) · ${rows.length}</button></div>`;
  if(S.ncView==="full"){const srt=rows.slice().sort((a,b)=>String(a.consec).localeCompare(String(b.consec),undefined,{numeric:true})),R=ncExportRows(rows),cols=Object.keys(R[0]||{}),long=new Set(["DESCRIPCIÓN DEL HALLAZGO","CORRECCIÓN","CAUSA RAÍZ","RESULTADO ESPERADO","ACCIONES"]);
    return h+`<div class="tablewrap ncfull"><table><thead><tr>${cols.map(c=>`<th>${esc(c.charAt(0)+c.slice(1).toLowerCase())}</th>`).join("")}</tr></thead><tbody>${R.map((r,i)=>`<tr class="link" data-href="#nc-${esc(srt[i].id)}" tabindex="0">${cols.map(c=>`<td class="${long.has(c)?"lc":""}">${c==="CONSECUTIVO"?`<span class="code">${esc(r[c])}</span>`:esc(long.has(c)?short(r[c],160):r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="hint" style="margin-top:8px">${rows.length} de ${all.length} · desplázate a la derecha para ver todas las columnas. Haz clic en una fila para abrir la acción.</p>`}
  h+=`<div class="tablewrap"><table><thead><tr><th>Consecutivo</th><th>Hallazgo</th><th>Proceso</th><th>Fuente</th><th>Responsable</th><th>Vence</th><th>Estado</th></tr></thead><tbody>`+
    rows.map(n=>`<tr class="link" data-href="#nc-${esc(n.id)}" tabindex="0"><td><a class="code" href="#nc-${esc(n.id)}">${esc(n.consec)}</a><div class="sub">${fmtD(n.detectedAt)}</div></td><td style="max-width:380px">${esc(short(n.description,140))}</td><td class="mono">${esc(n.process)}</td><td class="sub">${esc(n.source)}</td><td class="sub">${esc(nm(n.ownerId,"Sin asignar"))}</td><td class="num">${fmtD(ncDue(n))}</td><td>${ncChips(n)}</td></tr>`).join("")+
    `</tbody></table></div><p class="hint" style="margin-top:8px">${rows.length} de ${all.length}</p>`;
  return h;
}

function ncStagePanel(n){
  const id=n.id,st=n.stage;
  const card=(t,body)=>`<section class="card stack nc-active"><div class="row" style="justify-content:space-between"><h2>${t}</h2><span class="chip divulgacion">Etapa actual</span></div>${body}</section>`;
  const wait=w=>`<p class="hint">${w}</p>`;
  if(st==="clasificacion"){
    if(!isQuality())return card("Clasificación",wait("Esperando a que Calidad clasifique el reporte y asigne el director del proceso."));
    const ind=n.source==="Indicadores de gestión";
    return card("Clasificación",`<div class="grid3"><label class="f">Tipo<select id="nc-kind-${id}"><option value="AC" ${n.kind==="AC"?"selected":""}>Acción correctiva</option><option value="AM" ${n.kind==="AM"?"selected":""}>Acción de mejora</option></select></label>
      <label class="f">Clasificación<select id="nc-class-${id}">${Object.keys(CLASES).map(k=>`<option ${n.classification===k?"selected":""}>${k}</option>`).join("")}</select></label>
      <label class="f">Director del proceso${pickerHtml("nc."+id+".owner",n.ownerId||procOwner(n.process),"Responsable del proceso")}</label></div>
      <div class="callout"><b>Criterios.</b> ${Object.keys(CLASES).map(k=>`<b>${k}:</b> ${CLASES[k]}`).join(" ")}${ind?` <b>Indicadores:</b> se abre acción correctiva con 2 meses seguidos o 3 en un semestre fuera de meta; si no, clasifica como Observación.`:""} Las acciones de mejora no llevan clasificación.</div>
      <p class="hint">Al clasificar, el director tiene 10 días hábiles (hasta el ${fmtD(addBusinessDays(todayISO(),10))}) para el análisis y el plan de acción.</p>
      <div class="row"><button class="btn pri" data-act="nc-classify" data-id="${id}">Clasificar y asignar</button>${S.confirm==="ncno:"+id?`<span class="row"><input id="nc-noreason-${id}" placeholder="Motivo" style="width:220px"><button class="btn sm danger" data-act="nc-noproc-yes" data-id="${id}">Confirmar</button><button class="btn sm" data-act="cancel-confirm">Cancelar</button></span>`:`<button class="btn ghost" data-act="nc-noproc" data-id="${id}">No procede</button>`}</div>`);
  }
  if(st==="correccion"){
    if(!canDir(n))return card("Corrección",wait("Esperando a "+esc(nm(n.ownerId))+" para registrar la corrección."));
    return card("Corrección",`<p class="sub" style="margin:0">Qué se hizo para controlar y corregir el problema y sus consecuencias (reproceso, separación, concesión, devolución, destrucción…).</p>
      <label class="f">Corrección realizada<textarea id="nc-corr-${id}">${esc(n.correction&&n.correction.text||"")}</textarea></label>
      ${n.correction&&n.correction.assetId?fileLine(n.correction,n.consec+"_correccion"):""}${S.assets||S.local?`<label class="f">Evidencia (opcional)<input type="file" accept="${ACCEPT}" data-upload="nc-corr" data-id="${id}" id="up-nccorr-${id}"></label>`:""}
      <div class="row"><button class="btn pri" data-act="nc-correct" data-id="${id}">${n.classification==="Observación"?"Registrar corrección y pasar a cierre":"Registrar corrección y pasar a análisis"}</button></div>`);
  }
  if(st==="analisis"){
    const a=n.analysis||{};
    if(a.submitted){
      const body=analysisView(n)+(isQuality()?`${a.submittedBy&&a.submittedBy===S.me?`<div class="callout info">Tú enviaste este análisis. Lo ideal es que lo evalúe otra persona de Calidad.</div>`:""}<label class="f">Observaciones de la evaluación (obligatorias si devuelves)<textarea id="nc-evnote-${id}"></textarea></label><div class="row"><button class="btn pri" data-act="nc-eval-ok" data-id="${id}">Análisis adecuado: pasar a plan</button><button class="btn danger" data-act="nc-eval-back" data-id="${id}">Devolver al director</button></div>`:wait("Esperando la evaluación de Calidad."));
      return card("Análisis de causa · en evaluación",body);
    }
    if(!canDir(n))return card("Análisis de causa",wait("Esperando a "+esc(nm(n.ownerId))+" para el análisis de causa."));
    return card("Análisis de causa",analysisForm(n));
  }
  if(st==="plan"){
    if(!canDir(n))return card("Plan de acción",wait("Esperando a "+esc(nm(n.ownerId))+" para definir el plan de acción."));
    const D=ncDraft(n);
    return card("Plan de acción",`<p class="sub" style="margin:0">Actividades que eliminan la causa raíz${n.kind==="AM"?" o logran la mejora propuesta":""}. Cada una con responsable y fecha límite.</p>
      ${n.kind==="AM"?`<label class="f">Resultado esperado (criterio para verificar la eficacia)<textarea id="nc-exp-${id}" data-nc="${id}.expectedResult">${esc(D.expectedResult||"")}</textarea></label>`:`<div class="callout"><b>Causa raíz:</b> ${esc(n.analysis&&n.analysis.rootCause||"—")}<br><b>Resultado esperado:</b> ${esc(n.analysis&&n.analysis.expectedResult||"—")}</div>`}
      <div class="stack" style="gap:10px">${D.actions.map((x,i)=>`<div class="actrow"><span class="mono sub">${i+1}</span><input id="na-${id}-${i}" data-nc="${id}.actions.${i}.activity" value="${esc(x.activity)}" placeholder="Actividad"><div>${pickerHtml("nca."+id+"."+i,x.responsibleId,"Responsable")}</div><input type="date" id="nd-${id}-${i}" data-nc="${id}.actions.${i}.dueDate" value="${esc(x.dueDate||"")}" aria-label="Fecha límite"><button class="btn sm ghost" data-act="nc-act-del" data-id="${id}" data-i="${i}" aria-label="Quitar">Quitar</button></div>`).join("")||`<p class="sub">Agrega la primera actividad.</p>`}</div>
      <div><button class="btn sm" data-act="nc-act-add" data-id="${id}">Agregar actividad</button></div>
      <div class="row"><button class="btn" data-act="nc-plan-save" data-id="${id}">Guardar</button><button class="btn pri" data-act="nc-plan-go" data-id="${id}">Iniciar ejecución</button></div>`);
  }
  if(st==="ejecucion"){
    const acts=n.actions||[];
    return card("Ejecución del plan",`<div class="stack" style="gap:12px">${acts.map(a=>{const mine=S.canWrite&&(S.isAdmin||isDirector(n)||(S.me&&a.responsibleId===S.me));
      return `<div class="actcard ${a.status==="cumplida"?"ok":""}"><div class="row" style="justify-content:space-between"><b>${esc(a.activity)}</b>${a.status==="cumplida"?chip("seguimiento","Cumplida "+fmtD(a.doneAt)):a.dueDate&&a.dueDate<todayISO()?chip("vencida","Vencida"):chip("pendiente","Pendiente")}</div>
      <p class="sub" style="margin:4px 0 0">${esc(nm(a.responsibleId))} · fecha límite ${fmtD(a.dueDate)}</p>
      ${a.status==="cumplida"?`${a.doneNote?`<p style="margin:6px 0 0">${esc(a.doneNote)}</p>`:""}${a.assetId?`<div style="margin-top:8px">${fileLine(a,n.consec+"_accion")}</div>`:""}`:mine?`<label class="f" style="margin-top:8px">Qué se hizo<textarea id="ne-${n.id}-${a.id}" style="min-height:60px"></textarea></label>${a.assetId?fileLine(a,n.consec+"_accion"):""}${S.assets||S.local?`<label class="f">Evidencia<input type="file" accept="${ACCEPT}" data-upload="nc-act:${a.id}" data-id="${n.id}" id="up-nca-${n.id}-${a.id}"></label>`:""}<div class="row" style="margin-top:6px"><label class="f" style="flex-direction:row;align-items:center;gap:6px">Fecha en que se cumplió<input type="date" id="ned-${n.id}-${a.id}" value="${todayISO()}" max="${realToday()}" style="width:auto"></label><button class="btn sm pri" data-date="ned-${n.id}-${a.id}" data-act="nc-act-done" data-id="${n.id}" data-aid="${a.id}">Marcar cumplida</button></div>`:""}</div>`}).join("")}</div>
      <p class="hint">Cuando todas las actividades estén cumplidas, pasa a verificación de eficacia.</p>`);

function audInbox(){
  const r={programar:[],plan:[],ejec:[],informe:[],evalAud:[],evalCal:[]};
  S.audits.forEach(a=>{
    if(["cerrada","cancelada","noejecutada"].includes(a.status)||a.hist)return;
    if(a.status==="programada"&&S.isAdmin&&(!a.leadId||!a.plannedDate||audOverdue(a)))r.programar.push(a);
    if((a.status==="programada"||a.status==="plan")&&isLead(a)&&a.kind==="interna")r.plan.push(a);
    if(a.status==="ejecucion"&&(isLead(a)||(S.isAdmin&&a.kind==="externa")))r.ejec.push(a);
    if(a.status==="informe"&&(isLead(a)||(S.isAdmin&&a.kind==="externa")))r.informe.push(a);
    if(a.status==="evaluacion"){const ev=a.evals||[];
      if(a.kind==="interna"&&S.me&&auditeeOf(a)===S.me&&!ev.some(e=>e.role==="auditado"))r.evalAud.push(a);
      if(S.isAdmin&&a.kind==="interna"&&ev.some(e=>e.role==="auditado"))r.evalCal.push(a);
      }
  });
  r.total=r.programar.length+r.plan.length+r.ejec.length+r.informe.length+r.evalAud.length+r.evalCal.length;
  return r;
}

      <td class="sub">${a.kind==="externa"?esc(a.entity||"—"):esc(audLeadTxt(a))}</td><td class="dt">${a.plannedDate?fmtD(a.plannedDate):'<span class="miss">Sin fecha</span>'}</td><td class="dt">${audExec(a)?fmtD(audExec(a)):a.status==="noejecutada"?"—":'<span class="sub">Pendiente</span>'}</td><td>${audStateChip(a)}</td><td class="sub">${live&&pr.open&&audFindTxt(a)==="—"?"":esc(audFindTxt(a))}${live&&pr.open?`<div class="${pr.high?"miss":""}" title="No conformidades correctivas abiertas del proceso">${pr.open} NC abiertas${pr.mayor?" ("+pr.mayor+" mayor)":""}</div>`:""}</td><td class="ta-r">${qa?`<button class="btn sm ghost" data-act="ape-open" data-id="${esc(a.id)}">Fechas</button>`:""}</td></tr>`};

    sorted.map(row).join("")+
    (notCovered.length&&qa?notCovered.map(p=>`<tr class="nocov"><td><b>${esc(p.name)}</b><div class="sub"><span class="mono">${esc(p.code)}</span></div></td><td colspan="5"><span class="miss">Sin auditoría en ${y}</span></td><td class="ta-r">${y<cy?`<button class="btn sm" data-act="aph-open" data-y="${y}">Registrar</button>`:`<button class="btn sm" data-act="aud-new" data-kind="interna" data-proc="${esc(p.code)}">Programar</button>`}</td></tr>`).join(""):"")+
    (exts.length?`<tr class="grp"><td colspan="7">Auditorías externas</td></tr>`+exts.sort((a,b)=>String(a.plannedDate).localeCompare(String(b.plannedDate))).map(row).join(""):"")+

}

const APACT={
  "aud-yr":b=>{if(!b.dataset.y)return;S.audYear=Number(b.dataset.y);S.apEdit=null;render()},
  "ape-open":b=>{S.apEdit=S.apEdit===b.dataset.id?null:b.dataset.id;["ape-p","ape-e","ape-no"].forEach(x=>S.dirty.delete(x));render()},
  "ape-close":()=>{S.apEdit=null;render()},
  "ape-save":b=>{if(needActor())return;const a=getAud(b.dataset.id);if(!a)return;const p=val("ape-p")||null,e=val("ape-e")||null,no=(document.getElementById("ape-no")||{}).checked;
    if(e&&e>realToday())return toast("La fecha de ejecución no puede ser futura.");if(e&&p&&e<p.slice(0,4)+"-01-01")return toast("Revisa la fecha de ejecución.");
    const before=fmtD(a.plannedDate)+" / "+fmtD(audExec(a));a.plannedDate=p;if(p)a.year=Number(p.slice(0,4));a.executedDate=e;
    if(a.hist||a.status==="noejecutada")a.status=e&&!no?"cerrada":"noejecutada";
    audHist(a,"Fechas ajustadas",before+" → "+fmtD(p)+" / "+fmtD(e));guarded(async()=>{await putAud(a);S.apEdit=null},"Fechas guardadas")},
  "aph-open":b=>{S.aph={year:b&&b.dataset.y?Number(b.dataset.y):Math.min(S.audYear,curYear()-1)};S.audNew=null;render();const f=document.getElementById("aph-year");if(f)f.scrollIntoView({block:"center"})},
  "aph-close":()=>{S.aph=null;[...S.dirty].forEach(k=>{if(k.startsWith("aph-"))S.dirty.delete(k)});render()},
  "aph-save":()=>{if(needActor())return;const y=S.aph.year,c=cfg(),ex=[...S.audits.values()].filter(a=>a.year===y&&a.kind==="interna");const out=[];let err="";
    c.processes.forEach(p=>{if(ex.some(a=>a.process===p.code))return;const pd=val("aph-p-"+p.code),ed=val("aph-e-"+p.code);if(!pd&&!ed)return;
      if(ed&&ed>realToday())err="La fecha de ejecución de "+p.code+" es futura.";
      const ln=val("aph-l-"+p.code),au=[...S.auditors.values()].find(x=>auditorName(x.id).toLowerCase()===ln.toLowerCase());
      const num=k=>Number(val("aph-"+k+"-"+p.code))||0;
      const a={year:y,kind:"interna",extType:"",entity:"",process:p.code,plannedDate:pd||ed,executedDate:ed||null,leadId:au?au.id:null,leadName:au?"":ln,teamIds:[],auditeeId:null,status:ed?"cerrada":"noejecutada",hist:true,histFindings:{nc:num("nc"),obs:num("ob"),om:num("om")},plan:null,checklist:[],interviewed:"",findings:[],report:null,evals:[],extEval:null,history:[],createdAt:(ed||pd)+"T17:00:00.000Z"};
      a.updatedAt=a.createdAt;
      a.history=[{at:(pd||ed)+"T17:00:00.000Z",by:S.me,action:"Programada en el programa "+y,note:"Registro histórico · fecha "+fmtD(pd||ed)}].concat(ed?[{at:ed+"T17:00:00.000Z",by:S.me,action:"Auditoría ejecutada",note:"Hallazgos: "+audFindTxt(a)}]:[]);
      out.push(a)});
    if(err)return toast(err);if(!out.length)return toast("Escribe al menos una fecha.");
    const c0=nextAudCode("interna",y),n0=Number(c0.slice(-2));out.sort((a,b)=>String(a.plannedDate).localeCompare(String(b.plannedDate))).forEach((a,i)=>{a.code=c0.slice(0,-2)+pad(n0+i);a.id="aud_"+a.code});
    guarded(async()=>{for(const a of out){const b=clone(a);delete b.id;await S.db.doc("audits/"+a.id).set(b)}S.aph=null;S.audYear=y;[...S.dirty].forEach(k=>{if(k.startsWith("aph-"))S.dirty.delete(k)})},out.length+" auditorías registradas en "+y)}
};

function audStagePanel(a){

    const proc=a.kind==="interna"?a.process:null;
    return card("Programación",`<div class="grid3"><label class="f">Fecha<input type="date" id="ap-date-${id}" value="${esc(a.plannedDate||"")}"></label>

      <label class="f">Alcance<textarea id="apl-scope-${id}">${esc(p.scope||"Requisitos asociados al proceso "+procName(a.process)+" según la matriz de correlación F_GDM_05.")}</textarea></label>
      <label class="f">Criterios de referencia<textarea id="apl-crit-${id}">${esc(p.criteria||"Requisitos de la NTC ISO 9001:2015; procedimientos y formatos vigentes del proceso; resultados de la auditoría anterior y de la revisión por la dirección.")}</textarea></label>
      ${docs.length?`<p class="sub" style="margin:0">Documentos vigentes del proceso que sirven como criterio: ${docs.slice(0,12).map(d=>`<a class="code" href="#doc-${esc(d.id)}">${esc(d.code)}</a>`).join(", ")}${docs.length>12?" y "+(docs.length-12)+" más":""}</p>`:""}

        <div class="stack" style="gap:10px">${fs.map((f,i)=>`<div class="exrow"><select id="ex-r-${id}-${i}" data-ex="${id}.${i}.result">${RESULTS.filter(r=>r[0]!=="C"&&r[0]!=="NA").map(([k,l])=>`<option value="${k}" ${f.result===k?"selected":""}>${l}</option>`).join("")}</select><input id="ex-c-${id}-${i}" data-ex="${id}.${i}.clause" value="${esc(f.clause||"")}" placeholder="Cláusula"><select id="ex-p-${id}-${i}" data-ex="${id}.${i}.process">${cfg().processes.map(p=>`<option value="${esc(p.code)}" ${f.process===p.code?"selected":""}>${esc(p.code)}</option>`).join("")}</select><textarea id="ex-d-${id}-${i}" data-ex="${id}.${i}.note" placeholder="Descripción del hallazgo y evidencia">${esc(f.note||"")}</textarea><button class="btn sm ghost" data-act="ex-del" data-id="${id}" data-i="${i}">Quitar</button></div>`).join("")||`<p class="sub">Sin hallazgos registrados.</p>`}</div>
        <div><button class="btn sm" data-act="ex-add" data-id="${id}">Agregar hallazgo</button></div>
        <div class="row"><button class="btn" data-act="aud-ext-save" data-id="${id}">Guardar</button><button class="btn pri" data-act="aud-ext-go" data-id="${id}">Pasar a informe</button></div>`);
    }
    if(!canLead(a))return card("Ejecución",wait(esc(auditorName(a.leadId))+" está diligenciando la lista de verificación."));
    const cl=audCk(a),done=cl.filter(r=>r.result).length;
    return card("Lista de verificación",`<p class="sub" style="margin:0">Generada desde la matriz de correlación F_GDM_05 con las cláusulas donde el proceso es responsable. Registra la evidencia revisada y el resultado de cada pregunta. Avance: <b>${done} de ${cl.length}</b>.</p>
      <div class="checklist">${cl.map((r,i)=>`<div class="ckrow ${r.result?"r-"+r.result:""}"><div class="ckq"><span class="mono">${esc(r.clause)}</span> <b>${esc(r.title||"")}</b><textarea id="ck-q-${id}-${i}" data-ck="${id}.${i}.question" class="qtxt">${esc(r.question)}</textarea></div>
        <textarea id="ck-e-${id}-${i}" data-ck="${id}.${i}.evidence" placeholder="Evidencia revisada (registros, entrevistas, observación)">${esc(r.evidence||"")}</textarea>
        <div class="ckres"><select id="ck-r-${id}-${i}" data-ck="${id}.${i}.result" aria-label="Resultado"><option value="">Resultado</option>${RESULTS.map(([k,l])=>`<option value="${k}" ${r.result===k?"selected":""}>${l}</option>`).join("")}</select>
        ${["NCM","NCm","OBS","OM"].includes(r.result)?`<textarea id="ck-n-${id}-${i}" data-ck="${id}.${i}.note" placeholder="Redacción del hallazgo: requisito, qué se encontró, evidencia">${esc(r.note||"")}</textarea>`:""}</div></div>`).join("")}</div>
      <div class="row"><button class="btn sm" data-act="ck-add" data-id="${id}">Agregar pregunta</button></div>
      <label class="f">Personas entrevistadas (nombre y cargo)<textarea id="ck-int-${id}">${esc(a.interviewed||"")}</textarea></label>
      <div class="row"><button class="btn" data-act="aud-ck-save" data-id="${id}">Guardar avance</button><button class="btn pri" data-act="aud-ck-go" data-id="${id}">Terminar y pasar al informe</button></div>`);
  }
  if(st==="informe"){
    const can=a.kind==="externa"?isQuality():canLead(a);
    if(!can)return card("Informe",wait("El auditor líder está preparando el informe (plazo "+fmtD(a.report&&a.report.dueDate)+")."));
    const r=a.report||{},f=audFindings(a);
    return card("Informe de auditoría",`<p class="sub" style="margin:0">Plazo para entregarlo a la Gerencia: <b>${fmtD(r.dueDate)}</b> (5 días hábiles).</p>
      <h3>Hallazgos (${f.length})</h3>${findingsTable(a,f)}
      ${a.kind==="externa"?`<div class="stack" style="gap:6px">${r.assetId?fileLine(r,a.code+"_informe"):""}${S.assets||S.local?`<label class="f">Informe del ente (PDF u otro)<input type="file" accept="${ACCEPT}" data-upload="aud-rep" data-id="${id}" id="up-audrep-${id}"></label>`:""}</div>`:`<label class="f">Fortalezas del proceso<textarea id="ar-str-${id}">${esc(r.strengths||"")}</textarea></label>
      <label class="f">Debilidades y oportunidades de mejoramiento<textarea id="ar-weak-${id}">${esc(r.weaknesses||"")}</textarea></label>`}
      <label class="f">Conclusiones generales (conformidad y eficacia del proceso frente a los criterios)<textarea id="ar-conc-${id}">${esc(r.conclusions||"")}</textarea></label>
      <div class="callout">Al emitir el informe, cada no conformidad y oportunidad de mejora se registra en el módulo de no conformidades con fuente «Auditorías», ya clasificada, para que Calidad asigne el director del proceso. Las observaciones quedan solo en el informe.</div>
      <div class="row"><button class="btn" data-act="aud-rep-save" data-id="${id}">Guardar</button><button class="btn pri" data-act="aud-rep-issue" data-id="${id}">Emitir informe</button></div>`);
  }
  if(st==="evaluacion"){
    if(a.kind==="externa"){
      if(!isQuality())return card("Evaluación del servicio",wait("Calidad evalúa el servicio del auditor externo."));
      return card("Evaluación del servicio de auditoría externa",`<p class="sub" style="margin:0">Según el numeral 5.7 del P_GDM_03.</p>${["Cumplimiento del plan","Presentación clara y objetiva de las evidencias y no conformidades","Facilidad de interacción con el equipo de trabajo"].map((t,i)=>`<label class="f chk"><input type="checkbox" id="ee-${id}-${i}"> ${t}</label>`).join("")}<label class="f">Observaciones<textarea id="ee-note-${id}"></textarea></label><div class="row"><button class="btn pri" data-act="aud-ext-eval" data-id="${id}">Registrar evaluación y cerrar</button></div>`);
    }
    const ev=a.evals||[],done=ev.find(e=>e.role==="auditado"),isAud=S.me&&auditeeOf(a)===S.me,mineRole=!done&&(isAud||isQuality())?"auditado":null,proxy=mineRole&&!isAud;
    let b=`<p class="sub" style="margin:0">Formato F_GE_06: ${EVALN} preguntas de 1 (no aceptable) a 5 (excelente). Puntaje mínimo aceptable ${EVALMIN} de ${EVALMAX}. La responde el auditado (${esc(nm(auditeeOf(a)))}); el resultado alimenta el desempeño del auditor.</p>
      <div class="row">${done?chip(done.total>=EVALMIN?"seguimiento":"vencida","Auditado: "+done.total+"/"+EVALMAX):chip("pendiente","Evaluación del auditado: pendiente")}</div>`;
    if(mineRole){const sc=S.audEval[id]||{};
      b+=`<h3>${proxy?"Registrar la evaluación que diligenció el auditado":"Tu evaluación como auditado"} · auditor ${esc(audLeadTxt(a))}</h3>${proxy?`<p class="hint" style="margin:0">Úsalo solo para transcribir un F_GE_06 diligenciado en papel por el auditado. Quedará registrado que lo cargó Calidad.</p>`:""}<div class="evalgrid">${EVALQ.map(([g,qs],gi)=>`<div class="evg"><b>${g}</b>${qs.map((q,qi)=>{const k=gi+"_"+qi;return `<div class="evq"><span>${esc(q)}</span><div class="scale" role="radiogroup" aria-label="Puntaje">${[1,2,3,4,5].map(v=>`<button type="button" class="${Number(sc[k])===v?"on":""}" data-act="ev-score" data-id="${id}" data-k="${k}" data-v="${v}" aria-pressed="${Number(sc[k])===v}">${v}</button>`).join("")}</div></div>`}).join("")}</div>`).join("")}</div>
      <p><b>Total: ${Object.values(sc).reduce((s,v)=>s+Number(v),0)} / ${EVALMAX}</b> · ${Object.keys(sc).length} de ${EVALN} respondidas</p>
      <label class="f">Comentarios<textarea id="ev-note-${id}"></textarea></label><div class="row"><button class="btn pri" data-act="aud-eval" data-id="${id}" data-role="${mineRole}">Registrar evaluación</button></div>`}
    else if(!done)b+=wait("Esperando la evaluación del auditado ("+esc(nm(auditeeOf(a)))+").");
    if(a.status!=="evaluacion")return card("Evaluación del auditor",b);
    const f=audFindings(a),nf=f.filter(x=>["NCM","NCm","OM"].includes(x.result)),reg=nf.filter(x=>x.ncId).length,ok=(v)=>v?'<span class="ck ok">✓</span>':'<span class="ck no">!</span>';
    const checks=`<ul class="closeck"><li>${ok(a.report&&a.report.issuedAt)}Informe emitido${a.report&&a.report.issuedAt?" el "+fmtD(a.report.issuedAt):""}</li><li>${ok(reg===nf.length)}Hallazgos registrados en no conformidades: ${reg} de ${nf.length}</li><li>${ok(done)}Evaluación del auditor por el auditado${done?": "+done.total+"/"+EVALMAX:" pendiente"}</li><li>${ok((a.files||[]).length)}Evidencias y registros adjuntos: ${(a.files||[]).length}${(a.files||[]).length?"":" (opcional)"}</li></ul>`;
    const closeB=!isQuality()?wait(done?"Evaluación registrada. Calidad revisa y cierra la auditoría.":""):S.confirm==="audclose:"+id?`<div class="callout warn stack" style="gap:8px"><span>La auditoría se cerrará <b>sin la evaluación del auditado</b>, así que no sumará al desempeño del auditor.</span><div class="row"><button class="btn danger" data-act="aud-close" data-id="${id}" data-force="1">Confirmar cierre</button><button class="btn" data-act="aud-close-no">Volver</button></div></div>`:`<div class="row"><button class="btn ${done?"pri":""}" data-act="aud-close" data-id="${id}">Cerrar auditoría</button>${done?"":'<span class="hint">Todavía falta la evaluación del auditado.</span>'}</div>`;
    return card("Evaluación del auditor",b)+`<section class="card stack"><h2>Cierre de la auditoría</h2><p class="sub" style="margin:0">Último paso del P_GDM_03. Calidad verifica que todo esté completo y cierra la auditoría.</p>${checks}${closeB}</section>`;
  }
  return"";
}
function findingsTable(a,f){
  if(!f.length)return `<p class="sub" style="margin:0">Sin hallazgos: todos los requisitos evaluados fueron conformes.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Cláusula</th><th>Hallazgo</th><th>Registro</th></tr></thead><tbody>${f.map(x=>{const n=x.ncId&&S.ncs.get(x.ncId);return `<tr><td>${chip(x.result==="NCM"?"vencida":x.result==="NCm"?"revision":x.result==="OM"?"externo":"elaboracion",RESL[x.result])}</td><td class="mono">${esc(x.clause||"")}</td><td>${esc(x.note||x.question||"")}${x.evidence?`<div class="sub">Evidencia: ${esc(x.evidence)}</div>`:""}</td><td>${n?`<a class="code" href="#nc-${esc(n.id)}">${esc(n.consec)}</a><div class="sub">${n.closed?"Cerrada":esc(NCL[n.stage])}</div>`:x.result==="OBS"?'<span class="sub">Solo informe</span>':'<span class="sub">Al emitir</span>'}</td></tr>`}).join("")}</tbody></table></div>`;
}
function audDonePanels(a){

  if(a.kind==="interna"&&(a.checklist||[]).length&&a.status!=="ejecucion")h+=`<section class="card"><h2>Lista de verificación</h2><p class="sub" style="margin:8px 0">${(a.checklist||[]).length} preguntas · ${RESULTS.map(([k,l])=>{const n=a.checklist.filter(r=>r.result===k).length;return n?l+": "+n:""}).filter(Boolean).join(" · ")}</p><details><summary>Ver respuestas</summary><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Cláusula</th><th>Pregunta</th><th>Evidencia</th><th>Resultado</th></tr></thead><tbody>${a.checklist.map(r=>`<tr><td class="mono">${esc(r.clause)}</td><td>${esc(r.question)}</td><td class="sub">${esc(r.evidence||"")}</td><td>${esc(RESL[r.result]||"—")}</td></tr>`).join("")}</tbody></table></div></details>${a.interviewed?`<p class="sub" style="margin:8px 0 0">Entrevistados: ${esc(a.interviewed)}</p>`:""}</section>`;
  if(a.report&&a.report.issuedAt){const r=a.report;h+=`<section class="card stack"><h2>Informe</h2><p class="sub" style="margin:0">Emitido el ${fmtD(r.issuedAt)} por ${esc(nm(r.issuedBy))}${r.issuedAt&&r.dueDate&&isoDay(r.issuedAt)>r.dueDate?' · <span class="miss">fuera de plazo</span>':""}</p>${findingsTable(a,audFindings(a))}${r.assetId?fileLine(r,a.code+"_informe"):""}<dl class="meta">${r.strengths?`<dt>Fortalezas</dt><dd>${esc(r.strengths)}</dd>`:""}${r.weaknesses?`<dt>Debilidades</dt><dd>${esc(r.weaknesses)}</dd>`:""}<dt>Conclusiones</dt><dd>${esc(r.conclusions||"—")}</dd></dl></section>`}
  if((a.evals||[]).length&&a.status!=="evaluacion")h+=`<section class="card"><h2>Evaluación del auditor</h2><ul class="log" style="margin-top:12px">${a.evals.map(e=>`<li><time>${fmtD(e.at)}</time><div><b>${e.role==="auditado"?"Auditado":"Calidad"}: ${e.total}/${EVALMAX}</b>${e.proxy?' <span class="sub">(transcrita por Calidad)</span>':""} ${e.total<EVALMIN?'<span class="miss">bajo el mínimo: requiere capacitación</span>':""}<div class="sub">${esc(nm(e.by))}${e.note?" · "+esc(e.note):""}</div></div></li>`).join("")}</ul></section>`;
  if(a.extEval)h+=`<section class="card"><h2>Evaluación del servicio externo</h2><p class="sub" style="margin:8px 0 0">${a.extEval.score} de 3 criterios cumplidos${a.extEval.note?" · "+esc(a.extEval.note):""}</p></section>`;

  return h;

/* ---- Matriz ---- */

  const procs=c.processes;
  let h=`<div class="pagehead"><div><h1>Matriz de requisitos</h1><p class="lede">Equivale al F_GDM_05: qué proceso es responsable (R) o participa (P) en cada requisito de la ISO 9001:2015. La lista de verificación de cada auditoría se arma con los requisitos donde el proceso es responsable, con la pregunta de esta matriz.</p></div>${edit?`<div class="row"><button class="btn pri" data-act="mat-save">Guardar matriz</button></div>`:""}</div>`;

function audAnalysis(y){

  const f=all.flatMap(a=>audFindings(a).map(x=>Object.assign({process:x.process||a.process,audit:a.code},x)));
  const bars=(rows)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return `<div class="bars">${rows.map(([l,v])=>`<div class="bar"><span class="bl">${esc(l)}</span><span class="bt"><span style="width:${v/mx*100}%"></span></span><span class="bv">${v}</span></div>`).join("")}</div>`};
  const byProc=c.processes.map(p=>[p.code,f.filter(x=>x.process===p.code&&x.result!=="OBS").length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
