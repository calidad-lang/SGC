  if(!ev.length)return h+`<div class="card"><div class="empty"><b>Aún no tiene evaluaciones</b>Cuando el auditado responda la evaluación de una auditoría, el resultado aparece aquí.</div></div>`;
  // por aspecto
  const grp=EVALQ.map(([g,qs],gi)=>{const vs=ev.flatMap(({e})=>qs.map((q,qi)=>Number((e.scores||{})[gi+"_"+qi])).filter(v=>v>0));return{g,avg:vs.length?vs.reduce((s,v)=>s+v,0)/vs.length:null,qs:qs.map((q,qi)=>{const v=ev.map(({e})=>Number((e.scores||{})[gi+"_"+qi])).filter(v=>v>0);return{q,avg:v.length?v.reduce((s,a)=>s+a,0)/v.length:null}})}});

  // evolución por año
  const ys=[...new Set(ev.map(({a})=>a.year))].sort();
  h+=`<section class="pcat"><header><h2>Evolución por año</h2></header><div class="dyears">${ys.map(y=>{const es=ev.filter(({a})=>a.year===y),p=Math.round(es.reduce((s,x)=>s+x.e.total,0)/es.length/EVALMAX*100);return `<div><span class="lvb"><i style="height:${p}%" class="${p>=minP?"g":p>=70?"y":"r"}"></i></span><b class="${pctCls(p)}">${p} %</b><span class="sub">${y} · ${es.length} ${es.length===1?"evaluación":"evaluaciones"}</span></div>`}).join("")}</div></section>`;
  h+=`<section class="pcat"><header><h2>Evaluaciones recibidas</h2><span class="countpill">${ev.length}</span></header><ul class="plist">${ev.map(({a,e})=>`<li><a href="#aud-${esc(a.id)}" class="evrow"><span class="pc">${esc(a.code)}</span><span class="pn"><b>${esc(procName(a.process))}</b><span class="sub">Evaluó ${esc(nm(e.auditeeId||e.by))}${e.proxy?" (transcrita por Calidad)":""} · ${fmtD(e.at)}${e.note?" · «"+esc(short(e.note,90))+"»":""}</span></span><span>${chip(e.total>=EVALMIN?"seguimiento":"vencida",e.total+"/"+EVALMAX+" · "+Math.round(e.total/EVALMAX*100)+" %")}</span></a></li>`).join("")}</ul></section></div>`;
  return h;
}

/* ================= MÓDULO RIESGOS Y OPORTUNIDADES ================= */
const PROBS=[[1,"Rara","Difícilmente ocurre; no ha ocurrido en los últimos 5 años"],[2,"Improbable","Puede ocurrir en circunstancias excepcionales; una vez en 2 a 5 años"],[3,"Posible","Alguna posibilidad de que ocurra; una vez al año"],[4,"Probable","Ocurre la mayoría de las veces; varias veces al año"],[5,"Casi seguro","Ocurre siempre; cada mes o más"]];
const IMPS=[[1,"Insignificante","Se corrige dentro del proceso, sin efecto en el cliente"],[2,"Menor","Reproceso interno o retraso menor a un día"],[3,"Moderado","Afecta un pedido o un cliente; queja o costo moderado"],[4,"Mayor","Devolución de lote, pérdida de un cliente o sanción legal"],[5,"Catastrófico","Pérdida de un cliente principal, de la certificación o cierre"]];
const LVL_B=["11","12","21","22","31"],LVL_M=["41","32","23","13"],LVL_A=["51","52","42","43","33","24","14"];
const LVLN={B:"Bajo",M:"Moderado",A:"Alto",E:"Extremo"};
function level(p,i){if(!p||!i)return null;const k=""+p+i;return LVL_B.includes(k)?"B":LVL_M.includes(k)?"M":LVL_A.includes(k)?"A":"E"}
const lvlChip=(l,pre)=>l?`<span class="lvl lvl-${l}">${pre?esc(pre)+" ":""}${LVLN[l]}</span>`:`<span class="lvl lvl-x">${pre?esc(pre)+" ":""}Sin valorar</span>`;
const TREAT={B:["Aceptar"],M:["Reducir","Aceptar"],A:["Reducir","Transferir","Evitar"],E:["Reducir","Transferir","Evitar"]};
const TREATS=["Aceptar","Reducir","Transferir","Evitar"];
const RSTATUS={propuesto:["Propuesto","externo"],por_revisar:["Por revisar","pendiente"],vigente:["Vigente","seguimiento"],retirado:["Retirado","obsoleto"]};
const OSTATUS={planificacion:"En planificación",ejecucion:"En ejecución",cumplida:"Cumplida",no_ejecutada:"No ejecutada",descartada:"Descartada"};
const CKINDS={preventivo:"Preventivo (reduce la probabilidad)",detectivo:"Detectivo (reduce el impacto)",correctivo:"Correctivo (reduce el impacto)"};
const CHG_ST=[["solicitado","Solicitado"],["aprobado","Aprobado"],["implementacion","Implementación"],["verificado","Verificado"]];
const CHG_CLASS=["Instalaciones","Operaciones","Funciones y responsabilidades","Equipos","Sistema de gestión","Otro"];
const rInh=r=>level(r.prob,r.impact),rRes=r=>level(r.resProb,r.resImpact)||rInh(r);
const counted=r=>r.status==="vigente"||r.status==="por_revisar";
const canRsk=r=>S.canWrite&&(S.isAdmin||(S.me&&isMyProc(r.process)));
const rHist=(r,a,n)=>{r.history=(r.history||[]).concat([{at:nowISO(),by:S.me,action:a,note:n||""}]).slice(-200)};
async function putRsk(r){r.updatedAt=nowISO();const b=clone(r);delete b.id;await S.db.doc("risks/"+r.id).set(b)}
async function putOpp(o){o.updatedAt=nowISO();const b=clone(o);delete b.id;await S.db.doc("opps/"+o.id).set(b)}
async function putChg(c){c.updatedAt=nowISO();const b=clone(c);delete b.id;await S.db.doc("changes/"+c.id).set(b)}
const getRsk=id=>{const r=S.risks.get(id);return r?clone(r):null},getOpp=id=>{const o=S.opps.get(id);return o?clone(o):null},getChg=id=>{const c=S.changes.get(id);return c?clone(c):null};
function nextRiskCode(p){const re=new RegExp("^R_"+p+"_(\\d+)$");let mx=0;S.risks.forEach(r=>{const m=re.exec(r.code||"");if(m)mx=Math.max(mx,Number(m[1]))});return "R_"+p+"_"+String(mx+1).padStart(3,"0")}
function nextOppCode(p){const re=new RegExp("^OP_"+p+"_(\\d+)$");let mx=0;S.opps.forEach(o=>{const m=re.exec(o.code||"");if(m)mx=Math.max(mx,Number(m[1]))});return "OP_"+p+"_"+pad(mx+1)}
function nextChgCode(){const y=curYear(),p="CG-"+y+"-";let mx=0;S.changes.forEach(c=>{if((c.code||"").startsWith(p))mx=Math.max(mx,Number(c.code.slice(p.length))||0)});return p+String(mx+1).padStart(3,"0")}
function needsPlan(r){const l=rRes(r);return (l==="A"||l==="E")&&!(r.actions||[]).some(a=>a.status!=="cumplida")&&r.status!=="propuesto"&&r.status!=="retirado"}
function rskInbox(){
  const r={revisar:[],propuestos:[],controles:[],plan:[],acciones:[],mat:[],ncUpd:[],cambios:[],revAnual:[]};
  S.risks.forEach(x=>{const mine=S.isAdmin||(S.me&&isMyProc(x.process));if(x.status==="retirado")return;
    if(mine&&x.status==="por_revisar")r.revisar.push(x);if(mine&&x.status==="propuesto")r.propuestos.push(x);
    if(mine&&needsPlan(x))r.plan.push(x);
    (x.actions||[]).forEach(a=>{if(a.status!=="cumplida"&&S.me&&a.responsibleId===S.me)r.acciones.push({x,a})});
    if(S.isAdmin&&x.materialized&&x.matDecision==="pendiente")r.mat.push(x);
    if(mine&&x.status==="vigente"&&x.nextReview&&x.nextReview<=addMonths(todayISO(),1))r.revAnual.push(x)});
  S.controls.forEach(c=>{if(canProc(c.process)&&S.me!==null&&(S.isAdmin||isMyProc(c.process))&&ctrDueMonths(c,ymNow().y).length)r.controles.push(c)});
  if(S.isAdmin)S.ncs.forEach(n=>{if(n.closed&&n.closure&&n.closure.updateRisks&&!n.closure.risksUpdated)r.ncUpd.push(n)});
  S.changes.forEach(c=>{if(S.isAdmin&&c.status==="solicitado")r.cambios.push(c);if(c.status==="implementacion"&&(S.isAdmin||(S.me&&c.ownerId===S.me)))r.cambios.push(c)});
  r.total=r.revisar.length+r.propuestos.length+r.controles.length+r.plan.length+r.acciones.length+r.mat.length+r.ncUpd.length+r.cambios.length+r.revAnual.length;
  return r;
}

  const li=(x,extra)=>`<li><a href="#rsk-${esc(x.id)}"><span class="code">${esc(x.code)}</span> <b style="font-weight:500">${esc(short(x.description,90))}</b><div class="sub">${extra}</div></a>${lvlChip(rRes(x))}</li>`;
  const sec=(t,items,fn,empty)=>items.length?`<section class="card inbox"><h2>${t} <span class="countpill">${items.length}</span></h2><ul>${items.slice(0,15).map(fn).join("")}${items.length>15?`<li class="sub">y ${items.length-15} más</li>`:""}</ul></section>`:`<div class="inbox0"><b>${t}</b><span class="sub">${empty}</span></div>`;
  let h=`<h2 style="margin:28px 0 10px">Riesgos y oportunidades</h2><div class="stack">`;
  if(S.isAdmin&&r.mat.length)h+=sec("Riesgos materializados por decidir",r.mat,x=>li(x,"¿Abrir no conformidad?"),"");
  h+=sec("Riesgos importados por revisar",r.revisar,x=>li(x,esc(procName(x.process))),"No tienes riesgos por revisar.");
  h+=sec("Riesgos propuestos por validar",r.propuestos,x=>li(x,esc(procName(x.process))),"No hay riesgos propuestos.");
  h+=sec("Controles con seguimiento vencido",r.controles,c=>`<li><a href="#ctr-${esc(c.id)}"><span class="code">${esc(c.code)}</span> <b style="font-weight:500">${esc(short(c.name||c.description,80))}</b><div class="sub">Sin seguimiento: ${missLabel(ctrDueMonths(c,ymNow().y))}</div></a><span class="chip vencida">${ctrDueMonths(c,ymNow().y).length} meses</span></li>`,"Los controles están al día.");
  h+=sec("Riesgos altos o extremos sin plan de acción",r.plan,x=>li(x,"Define el plan de acción"),"Todos los riesgos altos y extremos tienen plan.");
  h+=sec("Acciones sobre riesgos a tu cargo",r.acciones,y=>`<li><a href="#rsk-${esc(y.x.id)}"><span class="code">${esc(y.x.code)}</span> <b style="font-weight:500">${esc(short(y.a.activity,90))}</b><div class="sub">Fecha límite ${fmtD(y.a.dueDate)}</div></a>${y.a.dueDate&&y.a.dueDate<todayISO()?chip("vencida","Vencida"):""}</li>`,"No tienes acciones pendientes.");
  if(r.revAnual.length)h+=sec("Revisión anual próxima o vencida",r.revAnual,x=>li(x,"Revisar antes del "+fmtD(x.nextReview)),"");
  if(S.isAdmin)h+=sec("No conformidades cerradas que piden actualizar riesgos",r.ncUpd,n=>`<li><a href="#nc-${esc(n.id)}"><span class="code">${esc(n.consec)}</span> <b style="font-weight:500">${esc(short(n.description,80))}</b><div class="sub">${esc(procName(n.process))}</div></a><button class="btn sm" data-act="nc-rsk-done" data-id="${esc(n.id)}">Matriz actualizada</button></li>`,"No hay pendientes.");
  h+=sec("Cambios por aprobar o en implementación",r.cambios,c=>`<li><a href="#chg-${esc(c.id)}"><span class="code">${esc(c.code)}</span> <b style="font-weight:500">${esc(short(c.purpose,80))}</b><div class="sub">${esc(procName(c.process))}</div></a>${chip("divulgacion",(CHG_ST.find(s=>s[0]===c.status)||[])[1]||c.status)}</li>`,"No hay cambios pendientes.");
  return h+`</div>`;
}

/* ---- Mapa de calor ---- */
function heatmap(list,res,act){
  const cnt={};list.forEach(r=>{const p=res?(r.resProb||r.prob):r.prob,i=res?(r.resImpact||r.impact):r.impact;if(p&&i){const k=p+"-"+i;cnt[k]=(cnt[k]||0)+1}});
  let h=`<div class="heat"><div class="hy">Probabilidad</div><div class="hgrid">`;
  for(let p=5;p>=1;p--){h+=`<div class="hl">${p}<span>${PROBS[p-1][1]}</span></div>`;for(let i=1;i<=5;i++){const n=cnt[p+"-"+i]||0,l=level(p,i),on=S.rskf.cell===(res?"r":"i")+p+"-"+i;h+=`<button class="hc lvl-${l} ${n?"has":""} ${on?"on":""}" ${act?`data-act="rsk-cell" data-v="${res?"r":"i"}${p}-${i}"`:"disabled"} title="${esc(PROBS[p-1][1]+" × "+IMPS[i-1][1]+": "+LVLN[l])}">${n||""}</button>`}}
  h+=`<div></div>${IMPS.map(x=>`<div class="hb">${x[0]}<span>${x[1]}</span></div>`).join("")}</div><div class="hx">Impacto</div></div>`;
  return h;
}

function viewRiskList(){

  const base=all.filter(r=>r.status!=="retirado");

  const rows=all.filter(r=>{
    if(f.proc&&r.process!==f.proc)return false;
    if(f.st==="activos"&&r.status==="retirado")return false;if(f.st&&f.st!=="activos"&&f.st!=="todos"&&r.status!==f.st)return false;
    if(f.lvl&&rRes(r)!==f.lvl)return false;if(f.mat&&!r.materialized)return false;
    if(f.cell){const res=f.cell[0]==="r",[p,i]=f.cell.slice(1).split("-").map(Number);const rp=res?(r.resProb||r.prob):r.prob,ri=res?(r.resImpact||r.impact):r.impact;if(rp!==p||ri!==i||!counted(r))return false}
    const q=f.q.trim().toLowerCase();if(q&&!((r.code||"").toLowerCase().includes(q)||(r.description||"").toLowerCase().includes(q)))return false;

  let h=`<div class="pagehead"><div><h1>Matriz de riesgos</h1><p class="lede">Reemplaza el F_GDM_02 de cada proceso. Valoración por probabilidad e impacto (1 a 5) con la matriz de calor del formato; el residual considera los controles.</p></div>${S.canWrite?`<button class="btn pri" data-act="rsk-new">Identificar riesgo</button>`:""}</div>`;

  if(noRisk.length)h+=`<div class="callout warn" style="margin-bottom:12px">Procesos sin riesgos propios validados: ${noRisk.map(p=>esc(p.code)).join(", ")}.</div>`;
  h+=`<div class="grid2 heatwrap"><section class="card"><h2>Riesgo inherente</h2>${heatmap(valued,false,true)}</section><section class="card"><h2>Riesgo residual</h2>${heatmap(valued,true,true)}</section></div>`;
  if(f.cell)h+=`<div class="callout info row" style="justify-content:space-between;margin:12px 0"><span>Filtrando por la celda ${f.cell[0]==="r"?"residual":"inherente"} ${esc(f.cell.slice(1).replace("-"," × "))}</span><button class="btn sm" data-act="rsk-cell" data-v="${esc(f.cell)}">Quitar filtro</button></div>`;
  h+=`<div class="toolbar" style="margin-top:12px"><input class="grow" id="rf-q" type="search" placeholder="Buscar por código o descripción…" value="${esc(f.q)}" aria-label="Buscar">
    <select id="rf-proc" style="width:auto" aria-label="Proceso"><option value="">Todos los procesos</option>${c.processes.map(p=>`<option value="${esc(p.code)}" ${f.proc===p.code?"selected":""}>${esc(p.code+" · "+p.name)}</option>`).join("")}</select>
    <select id="rf-lvl" style="width:auto" aria-label="Nivel"><option value="">Todos los niveles</option>${Object.entries(LVLN).map(([k,l])=>`<option value="${k}" ${f.lvl===k?"selected":""}>Residual ${l.toLowerCase()}</option>`).join("")}</select>
    <select id="rf-st" style="width:auto" aria-label="Estado">${[["activos","Activos"],["vigente","Vigentes"],["por_revisar","Por revisar"],["propuesto","Propuestos"],["retirado","Retirados"],["todos","Todos"]].map(([k,l])=>`<option value="${k}" ${f.st===k?"selected":""}>${l}</option>`).join("")}</select>
    <label class="f chk"><input type="checkbox" id="rf-mat" ${f.mat?"checked":""}> Materializados</label></div>`;
  if(!rows.length)return h+`<div class="card"><div class="empty"><b>Ningún riesgo en esta selección</b>Cambia los filtros.</div></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Código</th><th>Riesgo</th><th>Proceso</th><th>Inherente</th><th>Residual</th><th>Tratamiento</th><th>Estado</th></tr></thead><tbody>`+rows.map(r=>`<tr class="link" data-href="#rsk-${esc(r.id)}" tabindex="0"><td><a class="code" href="#rsk-${esc(r.id)}">${esc(r.code)}</a></td><td style="max-width:420px">${esc(short(r.description,140))}${r.materialized?' <span class="chip vencida">Materializado</span>':""}</td><td class="mono">${esc(r.process)}</td><td>${lvlChip(rInh(r))}</td><td>${lvlChip(level(r.resProb,r.resImpact))}</td><td class="sub">${esc(r.treatment||"—")}${needsPlan(r)?'<div class="miss">Sin plan de acción</div>':""}</td><td>${chip(RSTATUS[r.status][1],RSTATUS[r.status][0])}</td></tr>`).join("")+`</tbody></table></div><p class="hint" style="margin-top:8px">${rows.length} de ${all.length} riesgos</p>`;

/* ---- Controles y seguimiento (colección controls) ---- */
const MONTHS_L=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const byCode=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
const ctrsOf=r=>[...S.controls.values()].filter(c=>(c.riskIds||[]).includes(r.id)&&c.status!=="inactivo").sort(byCode);
const ctrRisks=c=>(c.riskIds||[]).map(x=>S.risks.get(x)).filter(Boolean);
const ctrMonthly=c=>ctrRisks(c).some(r=>r.status!=="retirado"&&["A","E"].includes(rRes(r)));
const fuScore=f=>f?((f.effective?60:0)+(f.evidenceOk?40:0)):null;
const canProc=p=>S.canWrite&&(S.isAdmin||(S.me&&isMyProc(p)));
const ymNow=()=>{const d=new Date(todayISO()+"T12:00:00");return{y:d.getFullYear(),m:d.getMonth()+1}};
function ctrStart(c){if(c.imported)return"0000-00";return (c.createdAt||"").slice(0,7)}
function ctrDueMonths(c,y){ // meses vencidos sin registro (mensual) o trimestres vencidos sin registro
  const {y:cy,m:cm}=ymNow();if(y>cy||c.status==="inactivo")return[];const lastM=y<cy?12:cm-1,fu=c.followups||{},st=ctrStart(c),miss=[];
  const due=k=>k>=st;
  if(ctrMonthly(c)){for(let m=1;m<=lastM;m++){const k=y+"-"+pad(m);if(due(k)&&!fu[k])miss.push(k)}}
  else{for(let q=1;q<=Math.floor(lastM/3);q++){const ks=[1,2,3].map(i=>y+"-"+pad((q-1)*3+i));if(due(ks[2])&&!ks.some(k=>fu[k]))miss.push(...ks)}}
  return miss;
}
const missLabel=ks=>{const s=ks.map(k=>MONTHS[Number(k.slice(5))-1]);return s.length>4?s.slice(0,3).join(", ")+" y "+(s.length-3)+" más":s.join(", ")};
function ctrYearStats(c,y){const fu=c.followups||{},ks=Object.keys(fu).filter(k=>k.startsWith(y+"-"));const sc=ks.map(k=>fuScore(fu[k]));return{n:ks.length,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null,miss:ctrDueMonths(c,y).length}}
function ctrEffectiveNow(c){const ks=Object.keys(c.followups||{}).sort();const last=ks.length?c.followups[ks.at(-1)]:null;return c.documented&&c.applied&&(!last||last.effective!==false)}
function suggestResidual(r){let p=r.prob,i=r.impact;const cs=ctrsOf(r);if(!p||!i||!cs.length||cs.some(c=>!c.kind))return null;const ok=cs.filter(ctrEffectiveNow);
  if(ok.some(c=>c.kind==="preventivo"))p=Math.max(1,p-(ok.filter(c=>c.kind==="preventivo").length>1?2:1));
  if(ok.some(c=>c.kind==="detectivo"||c.kind==="correctivo"))i=Math.max(1,i-1);return{p,i}}
function ctrPending(r){return ctrsOf(r).filter(c=>ctrDueMonths(c,ymNow().y).length)}
function ctrYears(cs){const ys=new Set([ymNow().y]);cs.forEach(c=>Object.keys(c.followups||{}).forEach(k=>ys.add(Number(k.slice(0,4)))));return yearRange([...ys]).map(Number)}
function mcell(c,y,m,act){
  const k=y+"-"+pad(m),f=(c.followups||{})[k],s=fuScore(f),{y:cy,m:cm}=ymNow(),fut=y>cy||(y===cy&&m>=cm);
  const miss=!f&&ctrDueMonths(c,y).includes(k);

function smoothPath(P){if(!P.length)return"";if(P.length<3)return P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const n=P.length,d=[],m=[];for(let i=0;i<n-1;i++)d.push((P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]));
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  let s="M"+P[0][0].toFixed(1)+" "+P[0][1].toFixed(1);for(let i=0;i<n-1;i++){const dx=(P[i+1][0]-P[i][0])/3;s+="C"+(P[i][0]+dx).toFixed(1)+" "+(P[i][1]+m[i]*dx).toFixed(1)+" "+(P[i+1][0]-dx).toFixed(1)+" "+(P[i+1][1]-m[i+1]*dx).toFixed(1)+" "+P[i+1][0].toFixed(1)+" "+P[i+1][1].toFixed(1)}return s}

  return h;

const uRec=id=>id?S.users.get(id):null;

function modPerm(m,id){const me=id===undefined;id=me?S.me:id;const role=me?S.role||myRole():(id==="admin-local"?"admin":(uRec(id)||{}).role||"consulta");if(role==="admin")return"edit";const r=uRec(id),o=r&&r.mods&&r.mods[m];return o||roleDef(role,m)}
const isMyProc=p=>!!(S.me&&p&&(procOwner(p)===S.me||(()=>{const r=uRec(S.me);return !!(r&&r.active!==false&&(r.processes||[]).includes(p))})()));
function canHist(){if(!S.me)return false;if(S.local&&S.me==='admin-local')return true;const r=uRec(S.me);if(r&&r.active!==false&&typeof r.hist==='boolean')return r.hist&&!!S.baseWrite;if(!S.local&&S.isEditor)return true;return !!(r&&r.active!==false&&r.role==='admin'&&S.baseWrite)}
const MODKEY=v=>{const m=modOf(v);return MODLIST.some(x=>x[0]===m)?m:null};

/* ================= MÓDULO EQUIPOS, CALIBRACIÓN Y MANTENIMIENTO (ISO 9001 7.1.3 y 7.1.5) ================= */
const EQK=[["medicion","Equipos de seguimiento y medición","M","Se calibran o verifican (ISO 9001 §7.1.5)"],["produccion","Máquinas de producción","P","Mantenimiento preventivo, predictivo y correctivo (§7.1.3)"],["servicio","Servicios e infraestructura","S","Compresores, montacargas, instalaciones (§7.1.3)"]];

const EQACT={cal:"Calibración",ver:"Verificación",mnt:"Mantenimiento preventivo",pred:"Mantenimiento predictivo"};
const eqActLab=(e,t)=>t==="cal"?EQACT[eqCalKind(e)]:EQACT[t];
const MTYPE={preventivo:"Preventivo",predictivo:"Predictivo",correctivo:"Correctivo"};
const EQAREA={med:{kinds:["medicion"],t:"cal",list:"#eq",prog:"#eq-programa",title:"Equipos de seguimiento y medición",progTitle:"Programa de calibración"},maq:{kinds:["produccion","servicio"],t:"mnt",list:"#eq-maquinaria",prog:"#eq-mantenimiento",title:"Maquinaria e infraestructura",progTitle:"Programa de mantenimiento"}};

const eqOn=e=>e.status==="uso"||e.status==="fuera";
const eqCalKind=e=>e.kind==="medicion"?(e.calType==="ver"?"ver":"cal"):null;
function nextEqCode(kind){const p="EQ-"+(EQK.find(k=>k[0]===kind)||EQK[0])[2]+"-";let mx=0;S.equips.forEach(e=>{if((e.code||"").startsWith(p))mx=Math.max(mx,Number(e.code.slice(p.length))||0)});return p+String(mx+1).padStart(3,"0")}
const lastEv=(e,arr,f)=>(e[arr]||[]).filter(f||(()=>true)).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null;
function eqCalDue(e){if(e.kind!=="medicion"||!Number(e.calFreq))return null;const l=lastEv(e,"cals",c=>c.result==="conforme");return l?addMonths(l.date,Number(e.calFreq)):null}
function eqPredDue(e){if(e.kind==="medicion"||!Number(e.predFreq))return null;const l=lastEv(e,"mnts",m=>m.type==="predictivo");return l?addMonths(l.date,Number(e.predFreq)):null}
function eqMntDue(e){if(e.kind==="medicion"||!Number(e.mntFreq))return null;const l=lastEv(e,"mnts",m=>m.type==="preventivo");return l?addMonths(l.date,Number(e.mntFreq)):null}
function eqCalState(e,at){at=at||todayISO();if(e.kind!=="medicion")return null;const l=lastEv(e,"cals",c=>c.date<=at);if(!l)return"sin";if(l.result!=="conforme")return"nc";const d=Number(e.calFreq)?addMonths(l.date,Number(e.calFreq)):null;if(d&&d<at)return"vencida";if(d&&d<=addMonths(at,1))return"pronto";return"vigente"}

/* programa: e.plan = {"2026":{cal:["2026-03"],mnt:["2026-02","2026-08"]}} ; evento.planK = "cal:2026-03" */
const eqPlan=(e,y)=>((e.plan||{})[y])||{};
function eqPlanItems(e,y){const p=eqPlan(e,y),out=[];(e.kind==="medicion"?["cal"]:["mnt","pred"]).forEach(t=>(p[t]||[]).forEach(m=>{const arr=t==="cal"?"cals":"mnts",ev=(e[arr]||[]).find(x=>x.planK===t+":"+m);out.push({e,t,m,k:t+":"+m,ev,late:!ev&&m<todayISO().slice(0,7),now:!ev&&m===todayISO().slice(0,7)})}));return out.sort((a,b)=>a.m.localeCompare(b.m))}
function eqSuggestPlan(e,y){const p={cal:[],mnt:[],pred:[]};const step=(base,f)=>{const r=[];if(!f)return r;let d=base;let g=0;while(d.slice(0,4)<String(y)&&g++<400)d=addMonths(d,f);while(d.slice(0,4)===String(y)&&g++<400){r.push(d.slice(0,7));d=addMonths(d,f)}return r};
  if(e.kind==="medicion"&&Number(e.calFreq)){const l=lastEv(e,"cals");p.cal=step(l?addMonths(l.date,Number(e.calFreq)):y+"-03-01",Number(e.calFreq))}

  return p}
function eqYearStats(y,ls){ls=ls||[...S.equips.values()].filter(eqOn);const it=ls.flatMap(e=>eqPlanItems(e,String(y)));const c=it.filter(x=>x.t==="cal"),m=it.filter(x=>x.t!=="cal");const d=a=>a.filter(x=>x.ev).length;return{it,c,m,cd:d(c),md:d(m),late:it.filter(x=>x.late).length}}

  const st=eqYearStats(y,ls),pc=(a,b)=>b?Math.round(a/b*100)+" %":"—",xs=T==="mnt"?st.m:st.c,xd=T==="mnt"?st.md:st.cd,lt=xs.filter(x=>x.late).length;

    <label class="f">Laboratorio o responsable de la calibración<input id="eg-prov-${k}" value="${esc(e.provider||"")}" placeholder="Ej.: laboratorio acreditado ONAC"></label></fieldset>`:""}
  ${kd==="medicion"?"":`<fieldset class="fs"><legend>Mantenimiento preventivo y predictivo (ISO 9001 §7.1.3)</legend><div class="grid3"><label class="f">Frecuencia del preventivo (meses)<input type="number" min="1" id="eg-mfreq-${k}" value="${esc(e.mntFreq||"")}" placeholder="Vacío si no aplica"></label><label class="f" style="grid-column:span 2">Actividades del mantenimiento preventivo<input id="eg-mtask-${k}" value="${esc(e.mntTasks||"")}" placeholder="Ej.: limpieza, lubricación, ajuste de cuchillas"></label></div>
    <div class="grid3"><label class="f">Frecuencia del predictivo (meses)<input type="number" min="1" id="eg-pfreq-${k}" value="${esc(e.predFreq||"")}" placeholder="Vacío si no aplica"></label><label class="f" style="grid-column:span 2">Técnicas del mantenimiento predictivo<input id="eg-ptask-${k}" value="${esc(e.predTasks||"")}" placeholder="Ej.: análisis de vibraciones, termografía, análisis de aceite"></label></div></fieldset>`}
  <div class="grid3"><label class="f">Instructivo o procedimiento<select id="eg-doc-${k}"><option value="">Ninguno</option>${docs.map(d=>`<option value="${esc(d.id)}" ${e.docId===d.id?"selected":""}>${esc(d.code+" · "+short(d.title,50))}</option>`).join("")}</select></label><label class="f chk" style="align-self:end"><input type="checkbox" id="eg-crit-${k}" ${e.critical?"checked":""}> Equipo crítico para la calidad del producto</label><label class="f">Estado<select id="eg-st-${k}">${Object.entries(EQST).map(([v,x])=>`<option value="${v}" ${e.status===v?"selected":""}>${x[0]}</option>`).join("")}</select></label></div>

function eqEvForm(e,t,ev){
  const k=ev?ev.id:"new",y=String(curYear()),pend=eqPlanItems(e,y).concat(eqPlanItems(e,String(curYear()-1))).filter(x=>!x.ev&&(t==="cal"?x.t==="cal":x.t!=="cal"));ev=ev||{};
  const corr=!ev.id&&S.evEdit&&S.evEdit.type==="correctivo"||ev.type==="correctivo";const pk=corr?"":ev.planK||(S.evEdit&&S.evEdit.planK)||(pend[0]&&pend[0].k)||"";const dflt=ev.date||pastDef((pk?pk.split(":")[1]+"-15":"")||todayISO());
  const isCal=t!=="mnt";
  return `<div class="evf stack" style="gap:10px"><h3>${ev.id?"Editar registro":isCal?"Registrar "+(e.calType==="ver"?"verificación":"calibración"):"Registrar mantenimiento"}</h3>
  <div class="grid3"><label class="f">Fecha<input type="date" id="ev-date" value="${esc(dflt)}" max="${realToday()}"></label>
  ${isCal?`<label class="f">Laboratorio o quién la hizo<input id="ev-prov" value="${esc(ev.provider||e.provider||"")}"></label><label class="f">N.º de certificado o informe<input spellcheck="false" autocomplete="off" id="ev-cert" value="${esc(ev.certNo||"")}"></label>`:`${(()=>{const ty=e.kind==="medicion"?"correctivo":ev.type||(S.evEdit&&S.evEdit.type)||"preventivo";return `<label class="f">Tipo de mantenimiento<select id="ev-type">${e.kind==="medicion"?"":`<option value="preventivo" ${ty==="preventivo"?"selected":""}>Preventivo (programado)</option><option value="predictivo" ${ty==="predictivo"?"selected":""}>Predictivo (vibraciones, termografía, aceite…)</option>`}<option value="correctivo" ${ty==="correctivo"?"selected":""}>Correctivo (falla, daño o ajuste)</option></select></label>`})()}<label class="f">Realizado por<input id="ev-by" value="${esc(ev.doneBy||"")}" placeholder="Técnico o empresa"></label>`}</div>
  ${isCal?`<div class="grid3"><label class="f">Error encontrado<input id="ev-err" value="${esc(ev.error||"")}" placeholder="Ej.: + 0,02 g"></label><label class="f">Error máximo permitido<input id="ev-emp" value="${esc(ev.emp||e.emp||"")}"></label><label class="f">Resultado<select id="ev-res"><option value="conforme" ${ev.result!=="no_conforme"?"selected":""}>Conforme: apto para uso</option><option value="no_conforme" ${ev.result==="no_conforme"?"selected":""}>No conforme: fuera de tolerancia</option></select></label></div>
    <label class="f">Si es no conforme: efecto sobre las mediciones anteriores (ISO 9001 §7.1.5.2)<textarea id="ev-imp" placeholder="Qué lotes o productos se midieron con el equipo desde la última calibración conforme y si sus resultados siguen siendo válidos">${esc(ev.impact||"")}</textarea></label>`
  :`<label class="f">Qué se hizo<textarea id="ev-desc" placeholder="${esc(e.mntTasks||"Actividades realizadas")}">${esc(ev.description||"")}</textarea></label><div class="grid3"><label class="f">Repuestos o insumos<input id="ev-parts" value="${esc(ev.parts||"")}"></label><label class="f">Horas fuera de servicio<input type="number" min="0" step="0.5" id="ev-down" value="${esc(ev.downHours||"")}"></label><label class="f">Estado final<select id="ev-res"><option value="ok" ${ev.result!=="pendiente"?"selected":""}>Equipo operativo</option><option value="pendiente" ${ev.result==="pendiente"?"selected":""}>Queda pendiente (fuera de servicio)</option></select></label></div>`}
  <div class="grid3">${!isCal&&e.kind==="medicion"?`<input type="hidden" id="ev-plan" value="">`:`<label class="f">Corresponde a lo programado${t==="mnt"?" (no aplica a correctivos)":""}<select id="ev-plan"><option value="">No estaba programado</option>${pend.concat(ev.planK?[{k:ev.planK,m:ev.planK.split(":")[1]}]:[]).filter((x,i,a)=>a.findIndex(z=>z.k===x.k)===i).map((x,i)=>`<option value="${esc(x.k)}" ${pk===x.k?"selected":""}>${esc(MONTHS_L[Number(x.m.slice(5,7))-1]+" "+x.m.slice(0,4))}</option>`).join("")}</select></label>`}${S.assets||S.local?`<label class="f" style="grid-column:span 2">${isCal?"Certificado o informe":"Evidencia u orden de trabajo"} (PDF o imagen)${ev.assetId?` <span class="sub">· actual: ${esc(ev.fileName)}</span>`:""}<input type="file" id="ev-file" accept="${ACCEPT}"></label>`:""}</div>
  <div class="row"><button class="btn pri" data-date="ev-date" data-act="ev-save" data-id="${esc(e.id)}" data-t="${t}" data-k="${esc(k)}">Guardar</button><button class="btn" data-act="ev-cancel">Cancelar</button></div></div>`;
}

  if(e.status==="propuesto")h+=`<div class="callout info" style="margin-bottom:12px">Equipo sugerido. Confirma que existe en la planta, completa marca, modelo, serie y frecuencias, y pulsa «Confirmar equipo». Si no aplica, dalo de baja.</div>`;
  if(e.status==="fuera")h+=`<div class="callout bad" style="margin-bottom:12px"><b>Fuera de servicio:</b> identifica el equipo como «No usar» en planta hasta su reparación o nueva calibración.</div>`;
  h+=`<div class="pvert">`;
  if(can&&S.eqEdit===id)h+=eqForm(e);
  h+=`<section class="pcat"><header><h2>Hoja de vida</h2></header><dl class="meta rqm" style="padding:12px 16px">
    <dt>Responsable</dt><dd>${esc(e.responsibleId?nm(e.responsibleId):nm(procOwner(e.process),"Líder del proceso"))}</dd><dt>En servicio desde</dt><dd>${fmtD(e.since)}</dd>

    ${e.kind==="medicion"?"":`<dt>Mantenimiento preventivo</dt><dd>${e.mntFreq?"Cada "+esc(e.mntFreq)+" meses":"Sin definir"}${e.mntTasks?" · "+esc(e.mntTasks):""}</dd><dt>Próximo preventivo</dt><dd>${md?`<b class="${md<todayISO()?"miss":""}">${fmtD(md)}</b>`:"—"}</dd><dt>Mantenimiento predictivo</dt><dd>${e.predFreq?"Cada "+esc(e.predFreq)+" meses":"Sin definir"}${e.predTasks?" · "+esc(e.predTasks):""}</dd>${eqPredDue(e)?`<dt>Próximo predictivo</dt><dd><b class="${eqPredDue(e)<todayISO()?"miss":""}">${fmtD(eqPredDue(e))}</b></dd>`:""}`}
    <dt>Instructivo</dt><dd>${doc?`<a class="code" href="#doc-${esc(doc.id)}">${esc(doc.code)}</a> ${esc(doc.title)}`:"—"}</dd></dl></section>`;
  // programa del año
  const pi=eqPlanItems(e,y);
  h+=`<section class="pcat"><header><h2>Programa ${y}</h2><span class="countpill">${pi.length}</span>${can&&e.status!=="baja"?`<span class="row" style="margin-left:auto;gap:6px">${!pi.length?`<button class="btn sm" data-act="eqp-suggest" data-id="${esc(id)}" data-y="${y}">Programar según frecuencias</button>`:""}<button class="btn sm ghost" data-act="eqp-add" data-id="${esc(id)}">Agregar actividad</button></span>`:""}</header>

    ${pi.length?`<ul class="plist eqpl">${pi.map(x=>`<li><div class="eqpi"><span class="mper">${esc(MONTHS[Number(x.m.slice(5,7))-1]+" "+x.m.slice(0,4))}</span><span>${eqActLab(e,x.t)}</span><span>${x.ev?chip("seguimiento","Ejecutado el "+fmtD(x.ev.date)):x.late?chip("vencida","Vencido"):x.now?chip("pendiente","Este mes"):`<span class="sub">Pendiente</span>`}</span>${can&&!x.ev?`<span class="row" style="gap:4px"><button class="btn sm" data-act="ev-new" data-id="${esc(id)}" data-t="${x.t}" data-k="${esc(x.k)}">Registrar</button><button class="btn sm ghost" data-act="eqp-del" data-id="${esc(id)}" data-k="${esc(x.k)}" data-y="${y}" aria-label="Quitar del programa">Quitar</button></span>`:"<span></span>"}</div></li>`).join("")}</ul>`:`<p class="sub" style="margin:0;padding:12px 16px">Sin actividades programadas en ${y}.</p>`}</section>`;

  {const ls=(e.mnts||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(e.kind!=="medicion"||ls.length||can)h+=`<section class="pcat"><header><h2>${e.kind==="medicion"?"Reparaciones y ajustes":"Mantenimientos"}</h2><span class="countpill">${ls.length}</span>${can?(e.kind==="medicion"?`<button class="btn sm ghost" data-act="ev-new" data-id="${esc(id)}" data-t="mnt" data-type="correctivo" style="margin-left:auto">Registrar reparación</button>`:`<span class="row" style="margin-left:auto;gap:6px"><button class="btn sm pri" data-act="ev-new" data-id="${esc(id)}" data-t="mnt" data-type="preventivo">Registrar preventivo o predictivo</button><button class="btn sm" data-act="ev-new" data-id="${esc(id)}" data-t="mnt" data-type="correctivo">Registrar correctivo</button></span>`):""}</header>

function viewEqProg(area){
  const A=EQAREA[area],y=String(S.eqYear||curYear()),cy=curYear(),ls=[...S.equips.values()].filter(e=>inArea(e,area)&&(eqOn(e)||Object.keys(e.plan||{}).includes(y))),qa=isQuality();
  const years=[...new Set(ls.flatMap(e=>Object.keys(e.plan||{})).concat(yearRange().map(String)).concat([String(cy+1)]))].sort();const yi=years.indexOf(y),prev=years[yi-1],next=years[yi+1];
  const items=ls.flatMap(e=>eqPlanItems(e,y)),dn=items.filter(x=>x.ev).length,lt=items.filter(x=>x.late).length,pc=(a,b)=>b?Math.round(a/b*100)+" %":"—";
  let h=`<div class="pagehead"><div><h1>${A.progTitle}</h1><p class="lede">${area==="med"?"Calibraciones y verificaciones programadas de los equipos de medición frente a las ejecutadas.":"Mantenimientos preventivos programados de la maquinaria e infraestructura frente a los ejecutados."} Puedes cargar los programas de años anteriores y registrar cada ejecución con su fecha real.</p></div>${qa?`<div class="row"><button class="btn pri" data-act="eqp-gen" data-y="${y}" data-area="${area}">Programar ${y} según frecuencias</button></div>`:""}</div>
  <div class="yearnav"><button class="btn sm" data-act="eq-yr" data-y="${prev||""}" ${prev?"":"disabled"}>‹ ${prev||""}</button><select id="eqp-year" aria-label="Año">${years.slice().reverse().map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select><button class="btn sm" data-act="eq-yr" data-y="${next||""}" ${next?"":"disabled"}>${next||""} ›</button></div>
  <div class="kpis" style="margin:0 0 16px"><div><span class="n">${pc(dn,items.length)}</span><span class="l">Cumplimiento ${y} (${dn} de ${items.length})</span></div><div><span class="n ${lt?"t-r":""}">${lt}</span><span class="l">Vencidas sin ejecutar</span></div><div><span class="n">${items.filter(x=>!x.ev&&!x.late).length}</span><span class="l">Pendientes</span></div></div>`;
  if(!items.length)return h+`<div class="card"><div class="empty"><b>No hay ${area==="med"?"calibraciones":"mantenimientos"} programados en ${y}</b>${qa?"Pulsa «Programar "+y+" según frecuencias» para proponer los meses con la frecuencia de cada equipo, o agrégalos uno a uno en la hoja de vida.":""}</div></div>`;

  if(S.view==="rskdoc"&&h!=="rsk-"+S.rskId){S.rskEdit=null;S.ctrEdit=null}
  if(h==="ind")S.view="ind";
  else if(h==="ind-nuevo"){S.view="indnew";S.indEdit=null}

  else if(h==="eq")S.view="eq";

  else if(h==="eq-maquinaria")S.view="eqmaq";
  else if(h==="eq-mantenimiento")S.view="eqmnt";

  else if(h==="rd")S.view="rd";
  else if(h.startsWith("rd-")){if(S.rdId!==h.slice(3)){S.rdIn=null;S.rdOut=null;S.rdConc=null;S.rdEdit=null;S.rdDone=null}S.view="rddoc";S.rdId=h.slice(3)}
  else if(h==="leg")S.view="leg";
  else if(h.startsWith("leg-")){if(S.legId!==h.slice(4)){S.levEdit=null;S.legEdit=null}S.view="legdoc";S.legId=h.slice(4)}
  else if(h==="pi")S.view="pty";

  else if(h==="pi-seguimiento"){S.view="pty";S.ptyf.pend=true}
  else if(h.startsWith("pi-")){if(S.ptyId!==h.slice(3)){S.reqEdit=null;S.pfu=null;S.ptyEdit=null}S.view="ptydoc";S.ptyId=h.slice(3)}
  else if(RSKR[h])S.view=RSKR[h];
  else if(h.startsWith("rsk-")){S.view="rskdoc";S.rskId=h.slice(4)}
  else if(h.startsWith("ctr-")){if(S.ctrId!==h.slice(4)){S.fuEdit=null;S.ctrEdit=null}S.view="ctrdoc";S.ctrId=h.slice(4)}
  else if(h.startsWith("opp-")){S.view="oppdoc";S.oppId=h.slice(4);S.oppNew=false}
  else if(h.startsWith("chg-")){S.view="chgdoc";S.chgId=h.slice(4)}
  else if(h.startsWith("aud-auditor-")){S.view="audtor";S.audtorId=h.slice(12)}
  else if(AUDR[h])S.view=AUDR[h];
  else if(h.startsWith("aud-")){S.view="auddoc";S.audId=h.slice(4)}
  else if(h==="nc-nuevo")S.view="ncnew";
  else if(h.startsWith("nc-")){S.view="ncdoc";S.ncId=h.slice(3)}
  else if(h==="nc")S.view="nc";
  else if(h.startsWith("doc-")){S.view="doc";S.docId=h.slice(4)}
  else if(h==="ncinforme")S.view="ind";
  else if(["maestro","bandeja","solicitudes","nuevo","informe","config","inicio","usuarios"].includes(h))S.view=h;
  else S.view="inicio";
  if(S.view!=="config")S.cfgDraft=null;
  if(S.view!=="doc")S.confirm=S.confirm==="delex"?S.confirm:null;
  render();window.scrollTo(0,0);
}

  db.doc("config/main").onSnapshot(s=>{S.config=s.exists?s.data():null;got.cfg=true;ready()},()=>{got.cfg=true;ready()});
  db.collection("requests").onSnapshot(s=>{S.requests=s.docs.map(x=>Object.assign({id:x.id},x.data()));if(S.ready)render()},()=>{});
  db.collection("ncs").onSnapshot(s=>{const m=new Map();s.docs.forEach(x=>{const v=Object.assign({},x.data());v.id=x.id;m.set(x.id,v)});S.ncs=m;if(S.ready)render()},()=>{});

  db.collection("auditors").onSnapshot(s=>{const m=new Map();s.docs.forEach(x=>{const v=Object.assign({},x.data());v.id=x.id;m.set(x.id,v)});S.auditors=m;if(S.ready)render()},()=>{});
  db.doc("audmeta/matrix").onSnapshot(s=>{S.audMatrix=s.exists?s.data():null;if(S.ready)render()},()=>{});
  const mapCol=(name,key)=>db.collection(name).onSnapshot(s=>{const m=new Map();s.docs.forEach(x=>{const v=Object.assign({},x.data());v.id=x.id;m.set(x.id,v)});S[key]=m;if(S.ready)render()},()=>{});
  mapCol("risks","risks");mapCol("inds","inds");mapCol("objs","objs");mapCol("parties","parties");mapCol("legal","legal");mapCol("equips","equips");mapCol("users","users");mapCol("reviews","reviews");mapCol("controls","controls");mapCol("opps","opps");mapCol("changes","changes");

}
